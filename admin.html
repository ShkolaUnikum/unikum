<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Админка — Уникум</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A0A73">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Tektur:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ============ ТОКЕНЫ (как в кабинете и на сайте) ============ */
:root{
  --ink:#5B1AB5;--deep:#22075A;--sun:#FF5FA8;--yellow:#FFDE3B;--mint:#2FC79A;--coral:#FF8A3D;--sky:#3FB6FF;
  --bg:#F5F1FC;--card:#fff;--text:#1F0B42;--muted:#6A5A8E;--line:rgba(65,14,173,.12);--soft:#FBF8FF;
  --r:16px;--display:"Tektur",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --glow:0 18px 40px -26px rgba(65,14,173,.5),0 0 0 1px rgba(65,14,173,.07);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px;text-transform:uppercase}
h2{font-size:17px;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:15px}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 14px;white-space:nowrap;
  font:700 12px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:#fff;text-decoration:none;
  background:linear-gradient(135deg,#FF72B3,#FF3D94 50%,#C82A92);box-shadow:0 10px 20px -12px rgba(255,79,158,.8),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:saturate(1.1)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn--ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(91,26,181,.25)}
.btn--ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn--ok{background:linear-gradient(135deg,#4FE0B5,#16A57E);box-shadow:0 10px 20px -12px rgba(22,165,126,.9)}
.btn--danger{background:#fff;color:#C0326F;box-shadow:inset 0 0 0 1.5px rgba(192,50,111,.35)}
.btn--xs{padding:7px 10px;font-size:11px;border-radius:9px}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(91,26,181,.3)}

/* каркас */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:18px 12px;color:#E9E1FF;
  background:radial-gradient(60% 50% at 80% 10%,#5A1BD0 0%,transparent 70%),linear-gradient(#36108F,#22075A)}
.side__logo{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;text-decoration:none}
.side__logo img{height:36px;width:auto}
.side__logo span{font:800 15px/1 var(--display);text-transform:uppercase;color:#fff}
.side__logo small{display:block;font:500 10px/1.2 var(--mono);color:#B9A8EE;text-transform:none;letter-spacing:0;margin-top:3px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:500;color:#D7CBFF}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:var(--ink);font-weight:700}
.nav a[aria-current="page"] svg{color:var(--sun)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--sun)}
.side__foot{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);font-size:11.5px;color:#C8BBF5;display:grid;gap:8px}
.side__foot a{color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px max(20px,env(safe-area-inset-right)) 12px 24px;background:rgba(245,241,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top__menu{display:none;width:40px;height:40px;border:0;border-radius:11px;background:#fff;box-shadow:var(--glow)}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;border:0;border-radius:12px;padding:11px 14px 11px 38px;background:#fff;box-shadow:var(--glow);outline:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who label{font-size:11px;color:var(--muted)}
.who select{border:0;border-radius:11px;padding:9px 30px 9px 12px;background:#fff;box-shadow:var(--glow);font-weight:700;color:var(--ink)}
.demo{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 9px;border-radius:999px;background:#FFF1A8;color:#7A5A00}
.content{padding:24px max(20px,env(safe-area-inset-right)) 60px 24px;display:grid;gap:20px;align-content:start;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.vhead p{color:var(--muted);margin-top:6px;max-width:70ch}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--glow);padding:18px;min-width:0}
.card__h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--glow);padding:16px;text-decoration:none;display:grid;gap:2px;transition:transform .15s}
a.kpi:hover{transform:translateY(-2px)}
.kpi b{font:800 28px/1.1 var(--display);color:var(--ink)}
.kpi span{color:var(--muted);font-size:12px}
.kpi--warn b{color:#C0256E}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:#DBF7EE;color:#0E7A5A}.p-wait{background:#FFF4CC;color:#8A6400}.p-new{background:#FFE6F1;color:#C0256E}
.p-mute{background:#EEE8FA;color:var(--muted)}.p-lilac{background:#EDE3FF;color:var(--ink)}.p-ice{background:#E3F4FF;color:#1C6FA8}.p-bad{background:#FFE1E1;color:#B3261E}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;border-radius:10px;padding:8px 12px;background:#fff;color:var(--muted);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.tabs .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:999px;font-size:10px;background:var(--sun);color:#fff}

/* таблица */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);background:#fff;box-shadow:var(--glow)}
table{width:100%;border-collapse:collapse;min-width:880px}
th{position:sticky;top:0;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 12px;background:#FCFAFF;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#FAF6FF}
td small{display:block;color:var(--muted);font-size:11.5px}
td:first-child small{white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{border:0;border-radius:10px;padding:8px 26px 8px 10px;background:#fff;box-shadow:var(--glow)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* формы */
.field{display:grid;gap:5px}
.field > span{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:11px;padding:10px 12px;outline:0}
.input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);background:#fff}
.input[aria-invalid="true"]{border-color:#E5366B}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.err{color:#D42A60;font-size:12px;min-height:16px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--ink)}

/* боковая карточка клиента */
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(25,5,70,.4);backdrop-filter:blur(3px)}
.drawer__in{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);box-shadow:-30px 0 60px -30px rgba(10,0,40,.6);animation:slide .25s ease;padding:0 0 40px}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.drawer__head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px;color:#fff;background:radial-gradient(60% 80% at 90% 0%,#5A1BD0,transparent 70%),#410EAD}
.drawer__head small{color:#CFC2FF}
.drawer__head h2{font-size:20px;margin-top:4px}
.x{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
.drawer__body{padding:18px 22px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.access{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:14px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.access code{font:700 13px var(--mono);padding:4px 8px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.kid{display:grid;gap:10px;padding:14px;border-radius:14px;background:#fff;box-shadow:var(--glow)}
.bar{height:7px;border-radius:999px;background:#EEE6FB;overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--ink),var(--sun))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* диалог */
dialog{border:0;padding:0;border-radius:20px;width:min(560px,calc(100% - 24px));box-shadow:0 40px 80px -30px rgba(10,0,40,.7);color:var(--text)}
dialog::backdrop{background:rgba(25,5,70,.5);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg > p{color:var(--muted)}
.dlg__act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{white-space:pre-wrap;padding:14px;border-radius:14px;background:#F3FBF8;box-shadow:inset 0 0 0 1px #BFEBDD;font-size:12.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:inline-block;padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.seg input:checked + span{background:#fff;box-shadow:inset 0 0 0 2px var(--sun)}
.seg input:focus-visible + span{outline:3px solid var(--yellow)}

/* группы и журнал */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.group{display:grid;gap:10px;text-align:left;border:0;padding:16px;border-radius:var(--r);background:#fff;box-shadow:var(--glow);transition:transform .15s}
.group:hover{transform:translateY(-2px)}
.group__top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.group__meta{color:var(--muted);font-size:12px;display:grid;gap:2px}
.att{display:grid;gap:8px}
.att__row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.att__row small{display:block;color:var(--muted)}
.tog{display:flex;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.tog button{border:0;padding:8px 12px;background:#fff;font-weight:700;color:var(--muted)}
.tog button[aria-pressed="true"].y{background:#DBF7EE;color:#0E7A5A}
.tog button[aria-pressed="true"].n{background:#FFE6F1;color:#C0256E}

/* заявки, задания */
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:14px;background:#fff;box-shadow:var(--glow)}
.item__main{flex:1 1 260px;min-width:0}
.item__main b{display:block}
.item__main small{display:block;color:var(--muted);margin-top:2px}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:2px;font-size:20px;line-height:1;color:#E2D9F5}
.stars button.on{color:#F5B700}

/* журнал действий */
.log{display:grid}
.log__row{display:grid;grid-template-columns:120px 170px minmax(0,1fr);gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.log__row time{color:var(--muted)}
.log__row .src{font-weight:700}
.src--b24{color:#2FA8E0}

/* интеграции */
.b24{display:flex;align-items:center;gap:14px}
.b24__logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 15px var(--display);background:linear-gradient(135deg,#2FC7F7,#1E88E5)}
.map{width:100%;border-collapse:collapse;min-width:0}
.map td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:default}
.map tr:hover{background:none}
.arrow{color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:100;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--deep);color:#fff;font-size:13px;box-shadow:0 20px 40px -16px rgba(10,0,40,.7);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* адаптив */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;z-index:50;width:260px;transform:translateX(-105%);transition:transform .25s;box-shadow:30px 0 60px -30px rgba(0,0,0,.6)}
  .side.open{transform:none}
  .top__menu{display:grid;place-items:center;flex:none}
  .top{padding-left:max(16px,env(safe-area-inset-left))}
  .content{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .grid2{grid-template-columns:1fr}
  .who label,.demo{display:none}
}
@media (max-width:600px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:6px}
  .log__row{grid-template-columns:1fr;gap:2px}
  .search{max-width:none}
  .who select{max-width:150px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-dash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="3" y="15" width="7.5" height="6" rx="2"/><rect x="13.5" y="11.5" width="7.5" height="9.5" rx="2"/></g></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5a6.5 6.5 0 0 1 3 5.5"/></g></symbol>
  <symbol id="i-group" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 15l2 2 4-4"/></g></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 13h5l1.5 3h5L16 13h5"/></g></symbol>
  <symbol id="i-hw" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8.5 15l2 2 4-4"/></g></symbol>
  <symbol id="i-pay" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/></g></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></g></symbol>
  <symbol id="i-log" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></g></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></g></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div class="shell">
  <aside class="side" id="side">
    <a class="side__logo" href="#dash"><img src="img/logo-brain.png" alt=""><span>Уникум<small>админка школы</small></span></a>
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <div class="side__foot"><span>Прототип на демо-данных. Изменения хранятся только в этом браузере.</span><button class="link" style="color:#fff;text-align:left" id="resetDemo">Сбросить демо-данные</button><a href="cabinet.html" target="_blank" rel="noopener">Открыть кабинет клиента →</a><button class="link" style="color:#FFB3D9;text-align:left" id="logout">Выйти из админки</button></div>
  </aside>
  <div class="main">
    <header class="top">
      <button class="top__menu" id="menuBtn" aria-label="Меню"><svg width="20" height="20"><use href="#i-menu"/></svg></button>
      <label class="search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Поиск: родитель, ребёнок, телефон, логин, сделка" autocomplete="off"></label>
      <div class="who"><span class="demo">демо</span><label for="roleSel">Вы вошли как</label>
        <select id="roleSel">
          <option value="admin">Администратор</option>
          <option value="manager">Менеджер · Светлана</option>
          <option value="curator">Куратор · Елена</option>
          <option value="teacher">Преподаватель · Мария В.</option>
        </select></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="drawer" id="drawer" hidden><div class="drawer__in" id="drawerIn" role="dialog" aria-modal="true"></div></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ДЕМО-проверка входа: без него — на страницу входа (cabinet.html, логин adminTest).
   В рабочей версии вход сотрудника проверяет сервер. */
(function(){let ok=false;try{ok=sessionStorage.getItem('unikum-admin-auth')==='1'||localStorage.getItem('unikum-admin-auth')==='1'}catch(e){}

function groupView(id){
  const g=groupOf(id);if(!g)return '<p class="empty">Группа не найдена</p>';
  const kids=D.students.filter(s=>s.group===g.id);
  const last=nextWeekday(g.wd,g.time,-1), next=nextWeekday(g.wd,g.time);
  const key=g.id+'|'+last.toISOString().slice(0,10);
  const marks=D.attendance[key]||{};
  return `
  <div class="vhead"><div><a class="link" href="#groups">← Все группы</a><h1 style="margin-top:8px">${esc(g.name)}</h1><p>${g.solo?'Индивидуальные занятия':`${WDF[g.wd]}, ${g.time}`} · ${esc(g.teacher)} · ${kids.length} ${plural(kids.length,'ученик','ученика','учеников')}</p></div></div>
  <div class="grid2">
    <section class="card"><div class="card__h"><h2>Журнал · ${dtt(last)}</h2>${D.attendance[key]?'<span class="pill p-ok">отмечено</span>':'<span class="pill p-wait">не отмечено</span>'}</div>
      <div class="att">${kids.map(s=>{const ab=D.absences.find(a=>a.sid===s.id&&a.date.slice(0,10)===last.toISOString().slice(0,10));const m=marks[s.id]||(ab?'n':'y');
        return `<div class="att__row" data-sid="${s.id}"><div><b>${esc(s.name)}</b><small>${esc(client(s.fid).parent)}${ab?` · предупредили: ${esc(ab.reason.toLowerCase())}`:''}</small></div>
        <div class="tog"><button class="y" aria-pressed="${m==='y'}" data-m="y">Был</button><button class="n" aria-pressed="${m==='n'}" data-m="n">Нет</button></div></div>`}).join('')||'<p class="empty">В группе пока нет учеников</p>'}</div>
      ${kids.length?'<button class="btn" id="attSave" style="margin-top:14px">Сохранить отметки</button>':''}
    </section>
    <section class="card"><div class="card__h"><h2>Следующее · ${dtt(next)}</h2></div>
      <div class="list">${kids.map(s=>{const ab=D.absences.find(a=>a.sid===s.id&&a.date.slice(0,10)===next.toISOString().slice(0,10)&&a.status!=='done');
        const fr=D.freezes.find(f=>f.sid===s.id&&f.status!=='rejected'&&next>=new Date(f.from)&&next<=new Date(f.to));
        const locked=s.done>=openUpTo(s);
        return `<div class="item" style="box-shadow:inset 0 0 0 1px var(--line)"><div class="item__main"><b>${esc(s.name)}</b><small>занятие ${s.done+1} из ${PLANS[s.plan].n}</small></div>
          ${fr?'<span class="pill p-ice">❄ заморозка</span>':ab?`<span class="pill p-wait">не придёт · ${esc(ab.reason)}</span>`:locked?'<span class="pill p-bad">🔒 нужна оплата</span>':'<span class="pill p-ok">придёт</span>'}</div>`}).join('')}</div>
    </section>
  </div>`;
}

      log(`Проверено задание «${h.title}»: ${s.name} — ${h.stars}★, +${h.coins} монеток`);toast('Оценка и отзыв отправлены ученику ✓');
    }else if(e.target.closest('[data-redo]')){h.status='redo';log(`Задание «${h.title}» возвращено на доработку: ${s.name}`);toast('Задание вернулось ученику на доработку')}
    else return;
    save();renderNav('homework');draw();
  };
  draw();
},
payments(){
  $$('[data-paid]').forEach(b=>b.onclick=e=>{e.stopPropagation();payDialog(b.dataset.paid)});
  $$('tbody tr[data-cid]').forEach(tr=>tr.onclick=e=>{if(!e.target.closest('button'))openClient(tr.dataset.cid)});
},
integrations(){
  $('#bSave').onclick=()=>{
    const portal=$('#bPortal').value.trim(),hook=$('#bHook').value.trim();
    if(!/^https:\/\/[\w.-]+\.bitrix24\.(ru|by|kz|com)\/?$/i.test(portal)){$('#bPortal').setAttribute('aria-invalid','true');toast('Адрес портала вида https://название.bitrix24.ru');return}
    if(!/^https:\/\/.+\/rest\/\d+\/\w+\/?$/i.test(hook)){$('#bHook').setAttribute('aria-invalid','true');toast('Вебхук вида https://…/rest/1/ключ/');return}
    D.b24=Object.assign(D.b24,{connected:true,portal,webhook:hook,auto:$('#bAuto').checked,channel:(document.querySelector('[name=bCh]:checked')||{}).value||'sms'});
    log('Подключён Битрикс24 (демо)');save();toast('Битрикс24 подключён (демо)');route();
  };
  const off=$('#bOff');if(off)off.onclick=()=>{D.b24.connected=false;log('Битрикс24 отключён');save();route()};

},
log(){}
};

/* =====================================================================
   КАРТОЧКА КЛИЕНТА
   ===================================================================== */
function openClient(id){
  const c=client(id);if(!c)return;
  const kids=kidsOf(id), canEdit=role==='admin'||role==='manager';
  const a=c.access;
  $('#drawerIn').innerHTML=`
  <div class="drawer__head"><div><small>Клиент · ${esc(c.deal||'без сделки')}</small><h2>${esc(c.parent)}</h2><small>${esc(c.phone)}${c.email?' · '+esc(c.email):''}</small></div><button class="x" id="dClose" aria-label="Закрыть">✕</button></div>
  <div class="drawer__body">
    <section class="card"><div class="card__h"><h2>Личный кабинет</h2>${accessPill(a)}</div>
      ${a.status==='none'?`<p style="color:var(--muted);margin-bottom:12px">У семьи ещё нет логина. Создайте доступ — система придумает логин и пароль и отправит их клиенту.</p>${canEdit?'<button class="btn" id="aCreate">Создать доступ</button>':''}`
      :`<div class="access"><span>Логин <code>${esc(a.login)}</code></span><span style="color:var(--muted);font-size:12px">${a.status==='active'?'последний вход '+ago(a.last):a.status==='blocked'?'вход запрещён':'выдан '+ago(a.issued)+', ещё не входили'}</span></div>
        ${canEdit?`<div class="row" style="margin-top:12px"><button class="btn btn--ghost btn--xs" id="aReset">Сбросить пароль</button>${a.status==='blocked'?'<button class="btn btn--ghost btn--xs" id="aUnblock">Разблокировать</button>':'<button class="btn btn--danger btn--xs" id="aBlock">Заблокировать</button>'}</div>`:''}`}
    </section>
    ${kids.map(k=>{const tot=PLANS[k.plan].n,open=openUpTo(k),p=payState(k);
      return `<section class="kid" data-sid="${k.id}"><div class="card__h" style="margin:0"><h3>${esc(k.name)}, ${age(k.birth)} ${plural(age(k.birth),'год','года','лет')}</h3><span class="pill p-lilac">${k.program}</span></div>
      <div><small style="color:var(--muted)">Пройдено ${k.done} из ${tot} · открыто ${open}</small><div class="bar" style="margin-top:5px"><span style="width:${Math.round(k.done/tot*100)}%"></span></div></div>
      ${canEdit?`<div class="fgrid">
        <label class="field"><span>Программа</span><select data-k="program">${PROGRAMS.map(x=>`<option ${x===k.program?'selected':''}>${x}</option>`).join('')}</select></label>
        <label class="field"><span>Вариант обучения</span><select data-k="plan">${Object.entries(PLANS).map(([v,x])=>`<option value="${v}" ${v===k.plan?'selected':''}>${x.t} · ${x.n}</option>`).join('')}</select></label>
        <label class="field"><span>Способ оплаты</span><select data-k="payment">${Object.entries(PAYS).map(([v,x])=>`<option value="${v}" ${v===k.payment?'selected':''}>${x.t}</option>`).join('')}</select></label>
        <label class="field"><span>Группа</span><select data-k="group">${D.groups.map(g=>`<option value="${g.id}" ${g.id===k.group?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
        ${k.payment==='internal'?`<label class="field"><span>Оплачено занятий</span><input class="input" type="number" min="0" max="${tot}" data-k="paid" value="${k.paid}"></label><div class="field"><span>Следующий платёж</span><div style="padding-top:8px">${p?`<span class="pill p-${p.k}">${p.t}</span>`:'—'}</div></div>`:''}
      </div>`:`<dl class="kv"><dt>Вариант</dt><dd>${PLANS[k.plan].t}</dd><dt>Оплата</dt><dd>${PAYS[k.payment].t}</dd><dt>Группа</dt><dd>${esc(groupOf(k.group)?.name)}</dd></dl>`}
      </section>`}).join('')}
    ${canEdit?'<div class="row"><button class="btn" id="dSave">Сохранить изменения</button><span style="color:var(--muted);font-size:11.5px">Изменения тарифа и оплаты уйдут и в сделку Битрикс24</span></div>':''}
    <section class="card"><div class="card__h"><h2>История</h2></div><div class="log">${D.log.filter(l=>l.text.includes(c.parent)||kids.some(k=>l.text.includes(k.name+' ')||l.text.endsWith(k.name))).slice(0,8).map(l=>`<div class="log__row" style="grid-template-columns:110px minmax(0,1fr)"><time>${dtt(l.t)}</time><span>${esc(l.text)}</span></div>`).join('')||'<p class="empty">Пока пусто</p>'}</div></section>
  </div>`;
  $('#drawer').hidden=false;document.body.style.overflow='hidden';
  $('#dClose').onclick=closeDrawer;
  const on=(sel,fn)=>{const el=$(sel);if(el)el.onclick=fn};
  on('#aCreate',()=>accessDialog(c,'create'));
  on('#aReset',()=>accessDialog(c,'reset'));
  on('#aBlock',()=>{c.access.status='blocked';log(`Доступ заблокирован: ${c.parent}`);save();toast('Вход в кабинет заблокирован');openClient(id);refresh()});
  on('#aUnblock',()=>{c.access.status=c.access.last?'active':'issued';log(`Доступ разблокирован: ${c.parent}`);save();toast('Вход снова разрешён');openClient(id);refresh()});
  on('#dSave',()=>{
    $$('#drawerIn .kid').forEach(box=>{const k=student(box.dataset.sid),before=JSON.stringify([k.program,k.plan,k.payment,k.group,k.paid]);
      box.querySelectorAll('[data-k]').forEach(el=>{k[el.dataset.k]=el.dataset.k==='paid'?Math.max(0,Math.min(PLANS[k.plan].n,+el.value||0)):el.value});
      if(k.payment==='internal'&&!k.nextPay){k.nextPay=iso(Date.now()+30*DAY);k.payStep=10;if(!k.paid)k.paid=Math.min(PLANS[k.plan].n,k.done+10)}
      if(JSON.stringify([k.program,k.plan,k.payment,k.group,k.paid])!==before)log(`Изменены данные ученика ${k.name}: ${k.program}, ${PLANS[k.plan].t}, ${PAYS[k.payment].t}, ${groupOf(k.group).name}`)});
    save();toast('Сохранено ✓');openClient(id);refresh();
  });
}
function closeDrawer(){$('#drawer').hidden=true;document.body.style.overflow=''}
$('#drawer').onclick=e=>{if(e.target===e.currentTarget)closeDrawer()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden&&!$('#dlg').open)closeDrawer()});
function refresh(){const h=location.hash.slice(1).split('/')[0]||'dash';renderNav(h);if(h==='clients'){BIND.clients()}else if(h==='payments'||h==='dash'){route()}}

/* ---------- выдача доступа ---------- */
function accessDialog(c,mode){
  const login=mode==='create'?uniqueLogin(translit(c.parent.split(' ')[0])):c.access.login;
  let pass=genPass();
  const name=c.parent.split(' ')[1]||c.parent;
  const text=()=>`Здравствуйте, ${name}! ${mode==='create'?'Доступ в личный кабинет «Уникума»':'Новый пароль от личного кабинета «Уникума»'}:\n${CABINET_URL}\nЛогин: ${$('#acLogin')?$('#acLogin').value.trim():login}\nПароль: ${pass}\nПри первом входе придумайте свой пароль в разделе «Профиль».`;
  $('#dlgBody').innerHTML=`<h2>${mode==='create'?'Создать доступ':'Сбросить пароль'}</h2>
    <p>${esc(c.parent)} · ${esc(c.phone)}</p>
    <div class="fgrid">
      <label class="field"><span>Логин</span><input class="input" id="acLogin" value="${esc(login)}" ${mode==='reset'?'readonly':''} autocapitalize="none" spellcheck="false"></label>
      <div class="field"><span>Временный пароль</span><div class="row" style="flex-wrap:nowrap"><input class="input" id="acPass" value="${esc(pass)}" readonly><button class="btn btn--ghost btn--xs" id="acGen" type="button" title="Другой пароль">↻</button></div></div>
    </div>
    <div class="field"><span>Как отправить</span><div class="seg">${[['sms','SMS на '+c.phone],['telegram','Telegram'],['copy','Скопирую и отправлю сам']].map(([k,t],i)=>`<label><input type="radio" name="acCh" value="${k}" ${i===0?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></div>
    <div class="msg" id="acMsg"></div>
    <p class="err" id="acErr"></p>
    <div class="dlg__act"><button class="btn btn--ghost" type="button" id="acNo">Отмена</button><button class="btn" type="button" id="acOk">${mode==='create'?'Создать и отправить':'Сбросить и отправить'}</button></div>`;
  const upd=()=>{$('#acMsg').textContent=text()};
  upd();
  $('#acLogin').oninput=()=>{$('#acLogin').value=$('#acLogin').value.toLowerCase().replace(/[^a-z0-9._-]/g,'');$('#acErr').textContent='';upd()};
  $('#acGen').onclick=()=>{pass=genPass();$('#acPass').value=pass;upd()};
  $('#acNo').onclick=()=>$('#dlg').close();
  $('#acOk').onclick=async()=>{
    const l=$('#acLogin').value.trim();
    if(mode==='create'){
      if(l.length<3){$('#acErr').textContent='Логин — от 3 символов латиницей';return}
      if(D.clients.some(x=>x.id!==c.id&&x.access.login===l)){$('#acErr').textContent='Такой логин уже занят';return}
    }
    const ch=document.querySelector('[name=acCh]:checked').value;
    if(ch==='copy'){try{await navigator.clipboard.writeText(text())}catch(e){}}
    c.access={status:'issued',login:l,issued:iso(Date.now()),last:null};
    log(`${mode==='create'?'Выдан доступ':'Сброшен пароль'}: ${c.parent} (логин ${l}) — ${ch==='sms'?'отправлено SMS':ch==='telegram'?'отправлено в Telegram':'сообщение скопировано'}`);
    save();$('#dlg').close();
    toast(ch==='copy'?'Сообщение с логином и паролем скопировано':`Логин и пароль отправлены ${ch==='sms'?'по SMS':'в Telegram'} (демо)`);
    openClient(c.id);refresh();
  };
  $('#dlg').showModal();
}

/* ---------- новый клиент ---------- */
function newClient(){
  $('#dlgBody').innerHTML=`<h2>Новый клиент</h2><p>Обычно клиенты приходят из Битрикс24 автоматически. Здесь — ручное добавление.</p>
    <form id="ncForm" class="fgrid" novalidate>
      <label class="field wide"><span>Родитель (фамилия и имя)</span><input class="input" name="parent" required placeholder="Иванова Анна"></label>
      <label class="field"><span>Телефон</span><input class="input" name="phone" type="tel" required placeholder="+7"></label>
      <label class="field"><span>Сделка Битрикс24</span><input class="input" name="deal" placeholder="номер, необязательно"></label>
      <label class="field"><span>Ребёнок</span><input class="input" name="kid" required></label>
      <label class="field"><span>Дата рождения</span><input class="input" name="birth" type="date" required></label>
      <label class="field"><span>Программа</span><select name="program">${PROGRAMS.map(p=>`<option ${p==='Middle'?'selected':''}>${p}</option>`).join('')}</select></label>
      <label class="field"><span>Вариант обучения</span><select name="plan">${Object.entries(PLANS).map(([v,x])=>`<option value="${v}" ${v==='y2'?'selected':''}>${x.t} · ${x.n}</option>`).join('')}</select></label>
      <label class="field"><span>Способ оплаты</span><select name="payment">${Object.entries(PAYS).map(([v,x])=>`<option value="${v}">${x.t}</option>`).join('')}</select></label>
      <label class="field"><span>Группа</span><select name="group">${D.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></label>
      <label class="check wide"><input type="checkbox" name="give" checked> Сразу выдать доступ в кабинет</label>
      <p class="err wide" id="ncErr"></p>
      <div class="dlg__act wide"><button class="btn btn--ghost" type="button" id="ncNo">Отмена</button><button class="btn" type="submit">Добавить</button></div>
    </form>`;
  const f=$('#ncForm');
  $('#ncNo').onclick=()=>$('#dlg').close();
  f.onsubmit=e=>{
    e.preventDefault();
    const v=n=>f.elements[n].value.trim();
    for(const [n,m] of [['parent','Укажите родителя'],['phone','Укажите телефон'],['kid','Укажите имя ребёнка'],['birth','Укажите дату рождения']])
      if(!v(n)){f.elements[n].setAttribute('aria-invalid','true');$('#ncErr').textContent=m;f.elements[n].focus();return}
    if(v('phone').replace(/\D/g,'').length<10){f.elements.phone.setAttribute('aria-invalid','true');$('#ncErr').textContent='Телефон — не меньше 10 цифр';return}
    const c=addClient({parent:v('parent'),phone:v('phone'),deal:v('deal')?'Б24-'+v('deal').replace(/\D/g,''):'',kid:v('kid'),birth:v('birth'),program:v('program'),plan:v('plan'),payment:v('payment'),group:v('group')});
    log(`Добавлен клиент вручную: ${c.parent}`);
    $('#dlg').close();refresh();
    if(f.elements.give.checked){openClient(c.id);accessDialog(c,'create')}else toast('Клиент добавлен');
  };
  $('#dlg').showModal();
}
function addClient(o){
  const fid='f'+(Date.now().toString(36));
  const c={id:fid,parent:o.parent,phone:o.phone,email:'',deal:o.deal,created:iso(Date.now()),access:{status:'none'}};
  D.clients.unshift(c);
  const inst=o.payment==='internal';
  D.students.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),fid,name:o.kid,birth:o.birth,program:o.program,plan:o.plan,payment:o.payment,group:o.group,done:0,
    paid:inst?10:PLANS[o.plan].n,nextPay:inst?iso(Date.now()+30*DAY):null,payStep:inst?10:0});
  save();return c;
}

/* ---------- платёж по рассрочке ---------- */
function payDialog(sid){
  const s=student(sid),tot=PLANS[s.plan].n,left=tot-s.paid;
  $('#dlgBody').innerHTML=`<h2>Платёж получен</h2><p>${esc(s.name)} · ${esc(client(s.fid).parent)}. Сейчас открыто ${s.paid} из ${tot}.</p>
    <div class="fgrid"><label class="field"><span>Открыть ещё занятий</span><input class="input" id="pN" type="number" min="1" max="${left}" value="${Math.min(s.payStep||10,left)}"></label>
    <label class="field"><span>Следующий платёж</span><input class="input" id="pNext" type="date" value="${new Date(Date.now()+30*DAY).toISOString().slice(0,10)}"></label></div>
    <p style="color:var(--muted);font-size:12px">В рабочей версии это будет происходить само: платёжная система сообщит об оплате, и занятия откроются без менеджера.</p>
    <div class="dlg__act"><button class="btn btn--ghost" type="button" id="pNo">Отмена</button><button class="btn btn--ok" type="button" id="pOk">Открыть занятия</button></div>`;
  $('#pNo').onclick=()=>$('#dlg').close();
  $('#pOk').onclick=()=>{
    const n=Math.max(1,Math.min(left,+$('#pN').value||0));
    s.paid+=n;s.nextPay=s.paid>=tot?null:iso(new Date($('#pNext').value+'T12:00:00'));
    if(s.paid>=tot)s.payment='internal';
    log(`Платёж по рассрочке: ${s.name} — открыто ещё ${n} занятий (всего ${s.paid} из ${tot})`);
    save();$('#dlg').close();toast(`Открыто ещё ${n} ${plural(n,'занятие','занятия','занятий')} ✓`);route();
  };
  $('#dlg').showModal();
}

/* ---------- имитация сделки из Битрикс24 ---------- */
const SIM=[['Белова Кристина','Полина','2017-03-02','Junior'],['Тарасов Глеб','Марк','2014-10-21','Middle'],['Жукова Вера','Лиза','2012-05-30','High'],['Комаров Олег','Фёдор','2015-12-12','Middle']];
async function simulateDeal(){
  const out=$('#simOut');out.innerHTML='';
  const [parent,kid,birth,program]=SIM[D.clients.length%SIM.length];
  const deal='Б24-'+(1300+D.clients.length);
  const plan=['y1','y2','y3'][D.clients.length%3], payment=['bank','full','internal'][D.clients.length%3];
  const step=async(t,who='Битрикс24')=>{out.insertAdjacentHTML('beforeend',`<div class="item" style="box-shadow:inset 0 0 0 1px var(--line)"><span class="pill ${who==='Битрикс24'?'p-ice':'p-ok'}">${who}</span><div class="item__main">${t}</div></div>`);await new Promise(r=>setTimeout(r,550))};
  $('#bSim').disabled=true;
  await step(`Сделка <b>${deal}</b> перешла в стадию «Оплачено»: ${esc(parent)}, ребёнок ${esc(kid)}, ${program}, ${PLANS[plan].t}, ${PAYS[payment].t}`);
  const g=D.groups.find(x=>x.program===program&&!x.solo)||D.groups[0];
  const c=addClient({parent,phone:'+7 900 222-33-'+String(10+D.clients.length).slice(-2),deal,kid,birth,program,plan,payment,group:g.id});
  log(`Сделка ${deal} перешла в «Оплачено» → создан клиент ${parent}`,'Битрикс24');
  await step(`Создан клиент и ученик ${esc(kid)}, группа «${esc(g.name)}»${payment==='internal'?', открыто первые 10 занятий':', открыт весь курс'}`,'Система');
  if(D.b24.auto){
    const login=uniqueLogin(translit(parent.split(' ')[0]));
    c.access={status:'issued',login,issued:iso(Date.now()),last:null};
    log(`Выдан доступ: ${parent} (логин ${login}) — ${D.b24.channel==='manual'?'ждёт отправки менеджером':D.b24.channel==='sms'?'отправлено SMS':'отправлено в Telegram'}`,'Система');
    await step(`Выдан доступ: логин <code>${login}</code>, временный пароль сгенерирован. ${D.b24.channel==='manual'?'Менеджеру поставлена задача отправить его клиенту':D.b24.channel==='sms'?'Отправлено SMS':'Отправлено в Telegram'}`,'Система');
    await step(`В сделку ${deal} записаны логин и статус «Доступ выдан»`);
  }else await step('Автовыдача выключена — клиент ждёт в списке «Нет доступа»','Система');
  save();renderNav('integrations');$('#bSim').disabled=false;
  out.insertAdjacentHTML('beforeend',`<button class="btn btn--ghost btn--xs" style="justify-self:start" onclick="location.hash='clients';setTimeout(()=>openClient('${c.id}'),50)">Открыть клиента →</button>`);
}
