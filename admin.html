<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Админка — Уникум</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2A0A73">
<script>try{const t=localStorage.getItem('unikum-admin-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Tektur:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ============ ТОКЕНЫ (как в кабинете и на сайте) ============ */
:root{
  --ink:#5B1AB5;--deep:#22075A;--sun:#FF5FA8;--yellow:#FFDE3B;--mint:#2FC79A;--coral:#FF8A3D;--sky:#3FB6FF;
  --bg:#F5F1FC;--card:#fff;--text:#1F0B42;--muted:#6A5A8E;--line:rgba(65,14,173,.12);--soft:#FBF8FF;
  --r:16px;--display:"Tektur",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --glow:0 18px 40px -26px rgba(65,14,173,.5),0 0 0 1px rgba(65,14,173,.07);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 13px/1.5 var(--mono);-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px;text-transform:uppercase}
h2{font-size:17px;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:15px}
p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:10px 14px;white-space:nowrap;
  font:700 12px/1 var(--display);text-transform:uppercase;letter-spacing:.04em;color:#fff;text-decoration:none;
  background:linear-gradient(135deg,#FF72B3,#FF3D94 50%,#C82A92);box-shadow:0 10px 20px -12px rgba(255,79,158,.8),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:saturate(1.1)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn--ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(91,26,181,.25)}
.btn--ghost:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn--ok{background:linear-gradient(135deg,#4FE0B5,#16A57E);box-shadow:0 10px 20px -12px rgba(22,165,126,.9)}
.btn--danger{background:#fff;color:#C0326F;box-shadow:inset 0 0 0 1.5px rgba(192,50,111,.35)}
.btn--xs{padding:7px 10px;font-size:11px;border-radius:9px}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(91,26,181,.3)}

/* каркас */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px;padding:18px 12px;color:#E9E1FF;
  background:radial-gradient(60% 50% at 80% 10%,#5A1BD0 0%,transparent 70%),linear-gradient(#36108F,#22075A)}
.side__logo{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;text-decoration:none}
.side__logo img{height:36px;width:auto}
.side__logo span{font:800 15px/1 var(--display);text-transform:uppercase;color:#fff}
.side__logo small{display:block;font:500 10px/1.2 var(--mono);color:#B9A8EE;text-transform:none;letter-spacing:0;margin-top:3px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;text-decoration:none;font-weight:500;color:#D7CBFF}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a[aria-current="page"]{background:#fff;color:var(--ink);font-weight:700}
.nav a[aria-current="page"] svg{color:var(--sun)}
.nav .cnt{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:var(--sun)}
.side__foot{margin-top:auto;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);font-size:11.5px;color:#C8BBF5;display:grid;gap:8px}
.side__foot a{color:#fff}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px max(20px,env(safe-area-inset-right)) 12px 24px;background:rgba(245,241,252,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top__menu{display:none;width:40px;height:40px;border:0;border-radius:11px;background:#fff;box-shadow:var(--glow)}
.search{flex:1;max-width:460px;position:relative}
.search input{width:100%;border:0;border-radius:12px;padding:11px 14px 11px 38px;background:#fff;box-shadow:var(--glow);outline:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.who{margin-left:auto;display:flex;align-items:center;gap:10px}
.who label{font-size:11px;color:var(--muted)}
.who select{border:0;border-radius:11px;padding:9px 30px 9px 12px;background:#fff;box-shadow:var(--glow);font-weight:700;color:var(--ink)}
.demo{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:6px 9px;border-radius:999px;background:#FFF1A8;color:#7A5A00}
.content{padding:24px max(20px,env(safe-area-inset-right)) 60px 24px;display:grid;gap:20px;align-content:start;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.vhead p{color:var(--muted);margin-top:6px;max-width:70ch}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--glow);padding:18px;min-width:0}
.card__h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--glow);padding:16px;text-decoration:none;display:grid;gap:2px;transition:transform .15s}
a.kpi:hover{transform:translateY(-2px)}
.kpi b{font:800 28px/1.1 var(--display);color:var(--ink)}
.kpi span{color:var(--muted);font-size:12px}
.kpi--warn b{color:#C0256E}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.p-ok{background:#DBF7EE;color:#0E7A5A}.p-wait{background:#FFF4CC;color:#8A6400}.p-new{background:#FFE6F1;color:#C0256E}
.p-mute{background:#EEE8FA;color:var(--muted)}.p-lilac{background:#EDE3FF;color:var(--ink)}.p-ice{background:#E3F4FF;color:#1C6FA8}.p-bad{background:#FFE1E1;color:#B3261E}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:0;border-radius:10px;padding:8px 12px;background:#fff;color:var(--muted);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;box-shadow:none}
.tabs .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;margin-left:6px;padding:0 5px;border-radius:999px;font-size:10px;background:var(--sun);color:#fff}

/* таблица */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);background:#fff;box-shadow:var(--glow)}
table{width:100%;border-collapse:collapse;min-width:880px}
th{position:sticky;top:0;text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:12px 12px;background:#FCFAFF;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:#FAF6FF}
td small{display:block;color:var(--muted);font-size:11.5px}
td:first-child small{white-space:nowrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{border:0;border-radius:10px;padding:8px 26px 8px 10px;background:#fff;box-shadow:var(--glow)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* формы */
.field{display:grid;gap:5px}
.field > span{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--soft);border-radius:11px;padding:10px 12px;outline:0}
.input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink);background:#fff}
.input[aria-invalid="true"]{border-color:#E5366B}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.err{color:#D42A60;font-size:12px;min-height:16px}
.check{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--ink)}

/* боковая карточка клиента */
.drawer{position:fixed;inset:0;z-index:40;display:flex;justify-content:flex-end;background:rgba(25,5,70,.4);backdrop-filter:blur(3px)}
.drawer__in{width:min(560px,100%);height:100%;overflow:auto;background:var(--bg);box-shadow:-30px 0 60px -30px rgba(10,0,40,.6);animation:slide .25s ease;padding:0 0 40px}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.drawer__head{position:sticky;top:0;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 22px;color:#fff;background:radial-gradient(60% 80% at 90% 0%,#5A1BD0,transparent 70%),#410EAD}
.drawer__head small{color:#CFC2FF}
.drawer__head h2{font-size:20px;margin-top:4px}
.x{flex:none;width:36px;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-size:18px}
.drawer__body{padding:18px 22px;display:grid;gap:16px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.access{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:14px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.access code{font:700 13px var(--mono);padding:4px 8px;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.kid{display:grid;gap:10px;padding:14px;border-radius:14px;background:#fff;box-shadow:var(--glow)}
.bar{height:7px;border-radius:999px;background:#EEE6FB;overflow:hidden}
.bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--ink),var(--sun))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* диалог */
dialog{border:0;padding:0;border-radius:20px;width:min(560px,calc(100% - 24px));box-shadow:0 40px 80px -30px rgba(10,0,40,.7);color:var(--text)}
dialog::backdrop{background:rgba(25,5,70,.5);backdrop-filter:blur(3px)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg > p{color:var(--muted)}
.dlg__act{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.msg{white-space:pre-wrap;padding:14px;border-radius:14px;background:#F3FBF8;box-shadow:inset 0 0 0 1px #BFEBDD;font-size:12.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{position:relative}
.seg input{position:absolute;opacity:0}
.seg span{display:inline-block;padding:8px 12px;border-radius:10px;background:var(--soft);font-weight:700;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.seg input:checked + span{background:#fff;box-shadow:inset 0 0 0 2px var(--sun)}
.seg input:focus-visible + span{outline:3px solid var(--yellow)}

/* группы и журнал */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.group{display:grid;gap:10px;text-align:left;border:0;padding:16px;border-radius:var(--r);background:#fff;box-shadow:var(--glow);transition:transform .15s}
.group:hover{transform:translateY(-2px)}
.group__top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.group__meta{color:var(--muted);font-size:12px;display:grid;gap:2px}
.att{display:grid;gap:8px}
.att__row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.att__row small{display:block;color:var(--muted)}
.tog{display:flex;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.tog button{border:0;padding:8px 12px;background:#fff;font-weight:700;color:var(--muted)}
.tog button[aria-pressed="true"].y{background:#DBF7EE;color:#0E7A5A}
.tog button[aria-pressed="true"].n{background:#FFE6F1;color:#C0256E}

/* заявки, задания */
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px;border-radius:14px;background:#fff;box-shadow:var(--glow)}
.item__main{flex:1 1 260px;min-width:0}
.item__main b{display:block}
.item__main small{display:block;color:var(--muted);margin-top:2px}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;padding:2px;font-size:20px;line-height:1;color:#E2D9F5}
.stars button.on{color:#F5B700}

/* журнал действий */
.log{display:grid}
.log__row{display:grid;grid-template-columns:120px 170px minmax(0,1fr);gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:12.5px}
.log__row time{color:var(--muted)}
.log__row .src{font-weight:700}
.src--b24{color:#2FA8E0}

/* интеграции */
.b24{display:flex;align-items:center;gap:14px}
.b24__logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff;font:800 15px var(--display);background:linear-gradient(135deg,#2FC7F7,#1E88E5)}
.map{width:100%;border-collapse:collapse;min-width:0}
.map td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:default}
.map tr:hover{background:none}
.arrow{color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:100;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--deep);color:#fff;font-size:13px;box-shadow:0 20px 40px -16px rgba(10,0,40,.7);transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* адаптив */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;z-index:50;width:260px;transform:translateX(-105%);transition:transform .25s;box-shadow:30px 0 60px -30px rgba(0,0,0,.6)}
  .side.open{transform:none}
  .top__menu{display:grid;place-items:center;flex:none}
  .top{padding-left:max(16px,env(safe-area-inset-left))}
  .content{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .grid2{grid-template-columns:1fr}
  .who label,.demo{display:none}
}
@media (max-width:600px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}.kv dd{margin-bottom:6px}
  .log__row{grid-template-columns:1fr;gap:2px}
  .search{max-width:none}
  .who select{max-width:150px}
  h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ============ */
.theme-btn{flex:none;width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:11px;background:var(--card);color:var(--ink);box-shadow:var(--glow);transition:transform .2s}
.theme-btn:active{transform:rotate(-20deg) scale(.94)}
.theme-btn .i-sun,html[data-theme="dark"] .theme-btn .i-moon{display:none}
html[data-theme="dark"] .theme-btn .i-sun{display:block;color:var(--yellow)}

/* ============ НОЧНОЙ РЕЖИМ ============ */
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#B391FF;--bg:#090D22;--card:#111836;--text:#EEE8FF;--muted:#B3A5D9;--line:rgba(190,160,255,.14);--soft:#18203F;
  --s3:#141B3B;--edge:#2A3460;
  --glow:0 24px 50px -26px rgba(0,0,0,.85),0 0 0 1px rgba(190,160,255,.1);
}
html[data-theme="dark"] .side{background:radial-gradient(60% 50% at 80% 10%,rgba(90,27,208,.55) 0%,transparent 70%),linear-gradient(#170D45,#0B0A2A);box-shadow:1px 0 0 rgba(190,160,255,.1)}
html[data-theme="dark"] .nav a[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(190,160,255,.22)}
html[data-theme="dark"] .top{background:rgba(9,13,34,.88)}
html[data-theme="dark"] .top__menu,html[data-theme="dark"] .search input,html[data-theme="dark"] .who select,html[data-theme="dark"] .filters select,
html[data-theme="dark"] .kpi,html[data-theme="dark"] .tbl-wrap,html[data-theme="dark"] .kid,html[data-theme="dark"] .group,html[data-theme="dark"] .item,
html[data-theme="dark"] .tabs button,html[data-theme="dark"] .tog button,html[data-theme="dark"] .access code{background:var(--card)}
html[data-theme="dark"] .top__menu{color:var(--text)}
html[data-theme="dark"] .btn--ghost{background:var(--card);color:#E3D6FF;box-shadow:inset 0 0 0 1.5px rgba(179,145,255,.3)}
html[data-theme="dark"] .btn--ghost:hover{box-shadow:inset 0 0 0 1.5px #B391FF}
html[data-theme="dark"] .btn--danger{background:var(--card);color:#FF8DB2;box-shadow:inset 0 0 0 1.5px rgba(255,141,178,.35)}
html[data-theme="dark"] .link{text-decoration-color:rgba(179,145,255,.4)}
html[data-theme="dark"] .kpi--warn b{color:#FF8DB2}
html[data-theme="dark"] .tabs button[aria-pressed="true"]{background:#6A2BE0;color:#fff}
html[data-theme="dark"] th{background:var(--s3)}
html[data-theme="dark"] tbody tr:hover{background:rgba(179,145,255,.06)}
html[data-theme="dark"] .map tr:hover{background:none}
html[data-theme="dark"] .input:focus,html[data-theme="dark"] .field select:focus,html[data-theme="dark"] .field textarea:focus{background:#1E2850}
html[data-theme="dark"] .input[aria-invalid="true"]{border-color:#FF6F98}
html[data-theme="dark"] .err{color:#FF8DB2}
html[data-theme="dark"] .p-ok,html[data-theme="dark"] .tog button[aria-pressed="true"].y{background:rgba(47,199,154,.16);color:#72E6C3}
html[data-theme="dark"] .p-wait{background:rgba(255,222,59,.14);color:#FFE07A}
html[data-theme="dark"] .p-new,html[data-theme="dark"] .tog button[aria-pressed="true"].n{background:rgba(255,95,168,.16);color:#FF9CCB}
html[data-theme="dark"] .p-mute{background:var(--soft)}
html[data-theme="dark"] .p-lilac{background:rgba(179,145,255,.16);color:#D6C2FF}
html[data-theme="dark"] .p-ice{background:rgba(63,182,255,.14);color:#93D5FF}
html[data-theme="dark"] .p-bad{background:rgba(255,90,90,.15);color:#FF9A92}
html[data-theme="dark"] .demo{background:rgba(255,222,59,.14);color:#FFE07A}
html[data-theme="dark"] .bar{background:var(--edge)}
html[data-theme="dark"] .stars button{color:var(--edge)}
html[data-theme="dark"] .seg input:checked + span{background:var(--card)}
html[data-theme="dark"] .msg{background:rgba(47,199,154,.08);box-shadow:inset 0 0 0 1px rgba(47,199,154,.3)}
html[data-theme="dark"] dialog{background:var(--card);box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 0 1px rgba(190,160,255,.16)}
html[data-theme="dark"] dialog::backdrop,html[data-theme="dark"] .drawer{background:rgba(2,3,14,.6)}
html[data-theme="dark"] .drawer__head{background:radial-gradient(60% 80% at 90% 0%,rgba(90,27,208,.7),transparent 70%),#1C0E55}
html[data-theme="dark"] .toast{background:#2A1A6E;box-shadow:0 20px 40px -16px rgba(0,0,0,.9),0 0 0 1px rgba(190,160,255,.2)}

/* отскок при прокрутке за край — в цвет фона админки */
html{background:var(--bg)}

/* расписание */
.sch-days{display:grid;gap:12px}
.sch-day{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;padding-top:12px;border-top:1px solid var(--line)}
.sch-day:first-child{border-top:0;padding-top:0}
.sch-day__h{display:grid;gap:2px;align-content:start}
.sch-day__h b::first-letter{text-transform:uppercase}
.sch-day__h span{color:var(--muted);font-size:12px}
.sch-day--today .sch-day__h b{color:var(--sun)}
.sch-day--today .sch-day__h span::after{content:" · сегодня"}
.sch-empty{margin:0;color:var(--muted);font-size:12.5px;padding:6px 0}
.sch-item{padding:10px 12px}
.sch-item--trial{box-shadow:inset 3px 0 0 var(--sun),var(--glow)}
.sch-item--off{opacity:.55}
.sch-time{display:grid;min-width:62px;text-align:left}
.sch-time b{font:800 16px/1.1 var(--display)}
.sch-time small{color:var(--muted);font-size:11px}
@media (max-width:700px){.sch-day{grid-template-columns:1fr;gap:6px}}

/* оформление продажи и статистика */
dialog:has(.sale-sec){width:min(680px,calc(100% - 24px))}
.sale-sec{display:grid;gap:10px;padding:14px;border-radius:14px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.sale-sec > b{font-family:var(--display);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.sale-sum{margin:0;font-size:12.5px;color:var(--muted)}
.sale-sum:empty{display:none}
.sale-price{font-family:var(--display);white-space:nowrap}
.sale-tbl{min-width:640px}
.sale-tbl td,.sale-tbl th{white-space:nowrap}
.sale-tbl tbody tr{cursor:default}
.sale-bar{position:relative;display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:10px;overflow:hidden;background:var(--soft);font-size:12.5px}
.sale-bar span,.sale-bar b{position:relative;z-index:1}
.sale-bar i{position:absolute;inset:0 auto 0 0;background:rgba(255,95,168,.18)}
@media (max-width:900px){.kpis[style*="repeat(5"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}}

/* новые лиды */
.nl-item{align-items:center;gap:10px}
.nl-note{display:block;margin-top:4px;color:var(--text)!important}
.nl-groups{display:grid;gap:8px}
.nl-g{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer}
.nl-g:has(input:checked){box-shadow:inset 0 0 0 2px var(--accent,#ff5fa8)}
.nl-g span{display:grid;gap:2px;min-width:0}
.nl-g small{color:var(--muted);font-size:12.5px}
.nl-g em{font-style:normal;font-size:12px;color:var(--muted);white-space:nowrap}
.nl-g--full{opacity:.55}
@media (max-width:900px){.kpis[style*="repeat(5"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}}

/* база учеников */
.content>*{min-width:0}
.db-tools{gap:10px;margin-bottom:12px;align-items:center}
.db-tools .input{flex:1 1 280px;min-width:0}
.db-count{margin:0 0 8px;color:var(--muted);font-size:13px}
.db-tbl td small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.db-tbl td{vertical-align:top}
.db-tbl code{font-size:12.5px}
.db-copy{border:0;background:none;cursor:pointer;padding:2px 4px;font-size:13px;color:var(--muted)}
.db-copy:hover{color:var(--text)}

/* дожим */
.dz-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;align-items:start;gap:12px}
.dz-when{display:grid;gap:2px}
.dz-when b{font-family:var(--display);font-size:13px}
.dz-when small{color:var(--muted);font-size:12px}
.dz-late .dz-when b{color:#ff6b8b}
.dz-today .dz-when b{color:#ffb02e}
.dz-c{display:block;margin-top:4px;color:var(--text)!important;font-size:12.5px}
.dz-act{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:260px}
.dz-hist{display:grid;gap:6px;margin:0 0 12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:12.5px}
@media (max-width:700px){.dz-item{grid-template-columns:1fr}.dz-act{justify-content:flex-start;max-width:none}}

/* сотрудники */
.who__me{display:grid;line-height:1.15;text-align:right}
.who__me b{font-size:13px}
.who__me small{font-size:11px;color:var(--muted)}
.st-off td{opacity:.55}
.st-act{white-space:nowrap}
.st-act .btn{margin:0 4px 4px 0}
.st-hint{margin:-4px 0 0;font-size:12.5px;color:var(--muted)}

/* пароль и удаление сотрудника */
.pw-meter{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:10px;margin-top:6px}
.pw-meter i{display:block;height:6px;border-radius:6px;background:#ff6b8b;width:12%;transition:width .2s,background .2s}
.pw-meter i[data-s="1"]{background:#ffb02e}.pw-meter i[data-s="2"]{background:#7dd3a8}.pw-meter i[data-s="3"]{background:#2fc79a}
.pw-meter small{font-size:12px;color:var(--muted)}
.pw-in{font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em}
.st-warn{margin:0;padding:10px 12px;border-radius:12px;background:rgba(255,107,139,.12);font-size:13px}
</style>
</head>

<script>
/* =====================================================================
   АДМИНКА «УНИКУМ» — прототип на демо-данных.
   Всё хранится в localStorage этого браузера. В рабочей версии те же действия
   будут обращаться к серверу школы, а сервер — к базе, Битрикс24, SMS и Telegram.
   ===================================================================== */
const CABINET_URL='https://shkolaunikum.github.io/unikum/cabinet.html';
const KEY='unikum-admin-v1';

/* ---------- справочники (как в кабинете) ---------- */
const PLANS={y1:{t:'1 год',n:40},y2:{t:'2 года',n:80},y3:{t:'3 года',n:120},y2i:{t:'2 года индивидуально',n:80}};
const PAYS={full:{t:'Перевод на р/с',full:true},bank:{t:'Банковская рассрочка',full:true},internal:{t:'Внутренняя рассрочка',full:false}};
const PROGRAMS=['Junior','Middle','High'];
const REASONS=['Болезнь','Семейные обстоятельства','Поездка или отпуск','Школа: контрольные, олимпиады','Другое'];
const EXTRA={english:'Английский язык',ai:'Нейросети'};
const ROLES={
  /* Администратор — всё. Преподаватель — группы, расписание и уроки купивших.
     Первая линия — заявки и запись на вводный урок. МВУ — проводит вводные уроки и продаёт. */
  admin:{t:'Администратор',name:'Администратор',routes:['dash','clients','db','groups','schedule','requests','newleads','intro','dozhim','sales','homework','payments','staff','integrations','log']},
  line1:{t:'Первая линия',name:'Ольга (первая линия)',routes:['dash','requests','newleads','intro']},
  mvu:{t:'МВУ',name:'Анна (МВУ)',routes:['dash','intro','dozhim','sales']},
  teacher:{t:'Преподаватель',name:'Мария Викторовна',routes:['dash','groups','schedule','homework']}
};
const ROUTES=[
  {id:'dash',t:'Сводка',i:'i-dash'},{id:'clients',t:'Клиенты',i:'i-users'},{id:'db',t:'База учеников',i:'i-db'},{id:'groups',t:'Группы и журнал',i:'i-group'},{id:'schedule',t:'Расписание групп',i:'i-cal'},{id:'intro',t:'Вводные уроки',i:'i-target'},{id:'dozhim',t:'Дожим',i:'i-phone'},{id:'sales',t:'Продажи',i:'i-chart'},

];

/* ---------- демо-данные ---------- */
const DAY=86400000;
const iso=d=>new Date(d).toISOString();
function nextWeekday(wd,time,shift=0){ // ближайший день недели wd (0 — вс) в указанное время
  const [h,m]=time.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);
  let add=(wd-d.getDay()+7)%7;if(add===0&&d<new Date())add=7;d.setDate(d.getDate()+add+shift*7);return d;
}
function seed(){
  const groups=[
    {id:'g1',name:'Middle · суббота',program:'Middle',teacher:'Мария Викторовна',wd:6,time:'17:00'},
    {id:'g2',name:'Middle · среда',program:'Middle',teacher:'Мария Викторовна',wd:3,time:'18:30'},

    {id:'g5',name:'Индивидуальные',program:'Middle',teacher:'Дмитрий Андреевич',wd:5,time:'16:00',solo:true}
  ];
  // родитель, телефон, [дети], программа, тариф, оплата, группа, пройдено, сделка, доступ
  const raw=[
    ['Иванова Анна','+7 900 111-22-01',[['Миша','2016-04-12']],'Middle','y2','bank','g1',40,1201,'active'],
    ['Петров Сергей','+7 900 111-22-02',[['Артём','2015-09-03']],'Middle','y1','full','g1',12,1207,'active'],
    ['Смирнова Ольга','+7 900 111-22-03',[['Варя','2016-01-20'],['Лёша','2013-06-11']],'Middle','y3','internal','g1',22,1215,'active'],
    ['Кузнецова Мария','+7 900 111-22-04',[['Даня','2016-11-30']],'Middle','y2','internal','g2',9,1222,'issued'],
    ['Попов Андрей','+7 900 111-22-05',[['Соня','2015-03-14']],'Middle','y2','bank','g2',31,1230,'active'],
    ['Васильева Елена','+7 900 111-22-06',[['Тимур','2016-07-07']],'Middle','y1','full','g2',3,1238,'none'],
    ['Новикова Ирина','+7 900 111-22-07',[['Ева','2018-02-02']],'Junior','y1','full','g3',18,1241,'active'],
    ['Морозов Павел','+7 900 111-22-08',[['Гоша','2018-10-10']],'Junior','y2','internal','g3',6,1246,'active'],
    ['Волкова Наталья','+7 900 111-22-09',[['Алиса','2017-12-25']],'Junior','y1','bank','g3',1,1252,'none'],
    ['Соколов Игорь','+7 900 111-22-10',[['Макс','2011-05-05']],'High','y3','full','g4',57,1255,'active'],
    ['Лебедева Татьяна','+7 900 111-22-11',[['Ника','2012-08-19']],'High','y2','internal','g4',20,1261,'active'],
    ['Козлов Роман','+7 900 111-22-12',[['Илья','2011-01-29']],'High','y1','bank','g4',33,1266,'issued'],
    ['Федорова Юлия','+7 900 111-22-13',[['Кира','2014-04-04']],'Middle','y2i','full','g5',15,1270,'active'],
    ['Орлов Виктор','+7 900 111-22-14',[['Степа','2013-09-09']],'Middle','y2i','internal','g5',28,1274,'active']
  ];
  const clients=[],students=[];
  raw.forEach(([parent,phone,kids,program,plan,payment,group,done,deal,acc],i)=>{
    const fid='f'+(i+1);
    const login=acc==='none'?'':translit(parent.split(' ')[0]);
    clients.push({id:fid,parent,phone,email:'',deal:'Б24-'+deal,created:iso(Date.now()-(60+i*9)*DAY),
      access:acc==='none'?{status:'none'}:{status:acc,login,issued:iso(Date.now()-(40+i*3)*DAY),last:acc==='active'?iso(Date.now()-(i%5)*DAY-3600e3*(i+2)):null}});
    kids.forEach(([name,birth],k)=>{
      const tot=PLANS[plan].n, inst=payment==='internal';
      students.push({id:'s'+(students.length+1),fid,name,birth,program,plan,payment,group:k?pickGroup(groups,program,group):group,done:k?Math.max(0,done-7):done,
        paid:inst?Math.min(tot,done+(i%3===0?0:6)):tot,
        nextPay:inst?iso(Date.now()+((i%4)-2)*6*DAY):null,payStep:inst?10:0});
    });
  });
  const st=id=>students.find(s=>s.id===id);
  const g1next=nextWeekday(6,'17:00');
  return {
    groups,clients,students,
    absences:[
      {id:'a1',sid:'s1',date:iso(g1next),reason:'Болезнь',comment:'Температура, лечимся',makeup:true,status:'new',created:iso(Date.now()-2*3600e3)},
      {id:'a2',sid:'s6',date:iso(nextWeekday(3,'18:30')),reason:'Школа: контрольные, олимпиады',comment:'Олимпиада по математике',makeup:true,status:'new',created:iso(Date.now()-20*3600e3)},
      {id:'a3',sid:'s9',date:iso(nextWeekday(2,'17:00')),reason:'Поездка или отпуск',comment:'',makeup:false,status:'new',created:iso(Date.now()-30*3600e3)},
      {id:'a4',sid:'s12',date:iso(nextWeekday(4,'19:00',-1)),reason:'Семейные обстоятельства',comment:'',makeup:true,status:'makeup',created:iso(Date.now()-6*DAY)}
    ],
    freezes:[
      {id:'z1',sid:'s5',from:iso(Date.now()+5*DAY),to:iso(Date.now()+25*DAY),reason:'Поездка или отпуск: едем к бабушке',status:'requested',created:iso(Date.now()-5*3600e3)},
      {id:'z2',sid:'s11',from:iso(Date.now()+3*DAY),to:iso(Date.now()+33*DAY),reason:'Болезнь: восстановление после операции',status:'requested',created:iso(Date.now()-26*3600e3)}

function trialCfg(){let c={};try{c=JSON.parse(localStorage.getItem(TRIAL_KEY)||'{}')}catch(e){}

async function trialApi(path,body){const c=trialCfg();if(!c.url||!c.key)throw new Error('Не указан адрес сервера заявок или ключ');
  const r=await fetch(c.url.replace(/\/$/,'')+'/api/leads'+path,{method:body?'POST':'GET',headers:{'X-Api-Key':c.key,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===401?'Неверный ключ доступа':(j.error||'Ошибка '+r.status));return j}

/* ---------- группа: состав и журнал посещаемости ---------- */
function groupView(id){
  const g=groupOf(id);if(!g)return '<p class="empty">Группа не найдена</p>';
  const kids=D.students.filter(s=>s.group===g.id);
  const {last,next}=groupSlots(g);
  const key=g.id+'|'+last.toISOString().slice(0,10);
  const marks=D.attendance[key]||{};
  return `
  <div class="vhead"><div><a class="link" href="#groups">← Все группы</a><h1 style="margin-top:8px">${esc(g.name)}</h1><p>${g.solo?'Индивидуальные занятия':groupDays(g)} · ${esc(g.teacher)} · ${kids.length} ${plural(kids.length,'ученик','ученика','учеников')}</p></div></div>
  <div class="grid2">
    <section class="card"><div class="card__h"><h2>Журнал · ${dtt(last)}</h2>${D.attendance[key]?'<span class="pill p-ok">отмечено</span>':'<span class="pill p-wait">не отмечено</span>'}</div>
      <div class="att">${kids.map(s=>{const ab=D.absences.find(a=>a.sid===s.id&&a.date.slice(0,10)===last.toISOString().slice(0,10));const m=marks[s.id]||(ab?'n':'y');
        return `<div class="att__row" data-sid="${s.id}"><div><b>${esc(s.name)}</b><small>${esc(client(s.fid).parent)}${ab?` · предупредили: ${esc(ab.reason.toLowerCase())}`:''}</small></div>
        <div class="tog"><button class="y" aria-pressed="${m==='y'}" data-m="y">Был</button><button class="n" aria-pressed="${m==='n'}" data-m="n">Нет</button></div></div>`}).join('')||'<p class="empty">В группе пока нет учеников</p>'}</div>
      ${kids.length?'<button class="btn" id="attSave" style="margin-top:14px">Сохранить отметки</button>':''}
    </section>
    <section class="card"><div class="card__h"><h2>Следующее · ${dtt(next)}</h2></div>
      <div class="list">${kids.map(s=>{const ab=D.absences.find(a=>a.sid===s.id&&a.date.slice(0,10)===next.toISOString().slice(0,10)&&a.status!=='done');
        const fr=D.freezes.find(f=>f.sid===s.id&&f.status!=='rejected'&&next>=new Date(f.from)&&next<=new Date(f.to));
        const locked=s.done>=openUpTo(s);
        return `<div class="item" style="box-shadow:inset 0 0 0 1px var(--line)"><div class="item__main"><b>${esc(s.name)}</b><small>занятие ${s.done+1} из ${PLANS[s.plan].n}</small></div>
          ${fr?'<span class="pill p-ice">❄ заморозка</span>':ab?`<span class="pill p-wait">не придёт · ${esc(ab.reason)}</span>`:locked?'<span class="pill p-bad">🔒 нужна оплата</span>':'<span class="pill p-ok">придёт</span>'}</div>`}).join('')}</div>
    </section>
  </div>${groupScheduleCard(g)}`;
}

const BIND={
dash(){if(role==='mvu'||role==='line1')bindLessonButtons($('#view'));const b=$('#dashBook');if(b)b.onclick=()=>openTrialDlg()},
clients(){
  const draw=()=>{
    const q=Q.trim().toLowerCase(),fp=$('#fProg').value,fy=$('#fPay').value,fa=$('#fAcc').value;
    const list=D.clients.filter(c=>{
      const kids=kidsOf(c.id);
      if(fp&&!kids.some(k=>k.program===fp))return false;
      if(fy&&!kids.some(k=>k.payment===fy))return false;
      if(fa&&c.access.status!==fa)return false;
      if(!q)return true;
      return [c.parent,c.phone.replace(/\D/g,''),c.phone,c.access.login,c.deal,...kids.map(k=>k.name)].join(' ').toLowerCase().includes(q.replace(/^\+/,''));
    });
    $('#cnt').textContent=`${list.length} ${plural(list.length,'семья','семьи','семей')}`;
    $('#rows').innerHTML=list.map(c=>{const kids=kidsOf(c.id);
      return `<tr data-cid="${c.id}"><td><b>${esc(c.parent)}</b><small>${esc(c.phone)}</small></td>
      <td>${kids.map(k=>`${esc(k.name)}, ${age(k.birth)}`).join('<br>')}</td>
      <td>${kids.map(k=>`${k.program} · ${PLANS[k.plan].t}`).join('<br>')}</td>
      <td>${kids.map(k=>{const p=payState(k);return PAYS[k.payment].t+(p&&p.k==='bad'?' <span class="pill p-bad">долг</span>':'')}).join('<br>')}</td>
      <td>${kids.map(k=>esc(groupOf(k.group)?.name||'—')).join('<br>')}</td>
      <td>${accessPill(c.access)}${c.access.login?`<small>${esc(c.access.login)}</small>`:''}</td>
      <td><small style="color:#2FA8E0;font-weight:700">${esc(c.deal||'—')}</small></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Никого не нашли</td></tr>';
  };
  ['#fProg','#fPay','#fAcc'].forEach(s=>$(s).onchange=draw);

  $('#q').oninput=()=>{Q=$('#q').value;draw()};
  const nc=$('#newClient');if(nc)nc.onclick=()=>newClient();

groups(arg){
  if(!arg){const ng=$('#newGroup');if(ng)ng.onclick=()=>openGroupDlg();return}
  $$('[data-plan]').forEach(b=>b.onclick=()=>openPlanDlg(b.dataset.plan));
  $$('[data-add-lesson]').forEach(b=>b.onclick=()=>openLessonDlg(null,b.dataset.addLesson));
  bindLessonButtons($('#view'));
  $$('.tog button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  const s=$('#attSave');if(!s)return;
  s.onclick=()=>{
    const g=groupOf(arg), last=groupSlots(g).last, key=g.id+'|'+last.toISOString().slice(0,10);
    const first=!D.attendance[key];const m={};
    $$('.att__row').forEach(r=>{m[r.dataset.sid]=r.querySelector('[aria-pressed="true"]').dataset.m});
    D.attendance[key]=m;
    if(first)Object.keys(m).forEach(id=>{student(id).done++});
    const miss=Object.values(m).filter(x=>x==='n').length;
    log(`Отмечена посещаемость: ${g.name}, ${dt(last)} — были ${Object.keys(m).length-miss}, нет ${miss}`);
    toast('Отметки сохранены. Они уже видны семьям в журнале посещений ✓');route();
  };
},

function openClient(id){
  const c=client(id);if(!c)return;
  const kids=kidsOf(id), canEdit=role==='admin';
  const a=c.access;
  $('#drawerIn').innerHTML=`
  <div class="drawer__head"><div><small>Клиент · ${esc(c.deal||'без сделки')}</small><h2>${esc(c.parent)}</h2><small>${esc(c.phone)}${c.email?' · '+esc(c.email):''}</small></div><button class="x" id="dClose" aria-label="Закрыть">✕</button></div>
  <div class="drawer__body">
    <section class="card"><div class="card__h"><h2>Личный кабинет</h2>${accessPill(a)}</div>
      ${a.status==='none'?`<p style="color:var(--muted);margin-bottom:12px">У семьи ещё нет логина. Создайте доступ — система придумает логин и пароль и отправит их клиенту.</p>${canEdit?'<button class="btn" id="aCreate">Создать доступ</button>':''}`
      :`<div class="access"><span>Логин <code>${esc(a.login)}</code>${a.pass&&role==='admin'?` · пароль <code>${esc(a.pass)}</code>`:''}</span><span style="color:var(--muted);font-size:12px">${a.status==='active'?'последний вход '+ago(a.last):a.status==='blocked'?'вход запрещён':'выдан '+ago(a.issued)+', ещё не входили'}</span></div>
        ${canEdit?`<div class="row" style="margin-top:12px"><button class="btn btn--ghost btn--xs" id="aReset">Сбросить пароль</button>${a.status==='blocked'?'<button class="btn btn--ghost btn--xs" id="aUnblock">Разблокировать</button>':'<button class="btn btn--danger btn--xs" id="aBlock">Заблокировать</button>'}</div>`:''}`}
    </section>
    ${kids.map(k=>{const tot=PLANS[k.plan].n,open=openUpTo(k),p=payState(k);
      return `<section class="kid" data-sid="${k.id}"><div class="card__h" style="margin:0"><h3>${esc(k.name)}, ${age(k.birth)} ${plural(age(k.birth),'год','года','лет')}</h3><span class="row" style="gap:6px"><span class="pill p-lilac">${k.program}</span>${role==='admin'?`<button class="btn btn--danger btn--xs" data-del-kid="${k.id}">Удалить</button>`:''}</span></div>
      <div><small style="color:var(--muted)">Пройдено ${k.done} из ${tot} · открыто ${open}</small><div class="bar" style="margin-top:5px"><span style="width:${Math.round(k.done/tot*100)}%"></span></div></div>
      ${canEdit?`<div class="fgrid">
        <label class="field"><span>Программа</span><select data-k="program">${PROGRAMS.map(x=>`<option ${x===k.program?'selected':''}>${x}</option>`).join('')}</select></label>
        <label class="field"><span>Вариант обучения</span><select data-k="plan">${Object.entries(PLANS).map(([v,x])=>`<option value="${v}" ${v===k.plan?'selected':''}>${x.t} · ${x.n}</option>`).join('')}</select></label>
        <label class="field"><span>Способ оплаты</span><select data-k="payment">${Object.entries(PAYS).map(([v,x])=>`<option value="${v}" ${v===k.payment?'selected':''}>${x.t}</option>`).join('')}</select></label>
        <label class="field"><span>Группа</span><select data-k="group"><option value="" ${!k.group?'selected':''}>Без группы</option>${D.groups.map(g=>`<option value="${g.id}" ${g.id===k.group?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
        ${k.payment==='internal'?`<label class="field"><span>Оплачено занятий</span><input class="input" type="number" min="0" max="${tot}" data-k="paid" value="${k.paid}"></label><div class="field"><span>Следующий платёж</span><div style="padding-top:8px">${p?`<span class="pill p-${p.k}">${p.t}</span>`:'—'}</div></div>`:''}
      </div>`:`<dl class="kv"><dt>Вариант</dt><dd>${PLANS[k.plan].t}</dd><dt>Оплата</dt><dd>${PAYS[k.payment].t}</dd><dt>Группа</dt><dd>${esc(groupOf(k.group)?.name)}</dd></dl>`}
      </section>`}).join('')}
    ${canEdit?'<div class="row"><button class="btn" id="dSave">Сохранить изменения</button><span style="color:var(--muted);font-size:11.5px">Изменения тарифа и оплаты уйдут и в сделку Битрикс24</span></div>':''}
    <section class="card"><div class="card__h"><h2>История</h2></div><div class="log">${D.log.filter(l=>l.text.includes(c.parent)||kids.some(k=>l.text.includes(k.name+' ')||l.text.endsWith(k.name))).slice(0,8).map(l=>`<div class="log__row" style="grid-template-columns:110px minmax(0,1fr)"><time>${dtt(l.t)}</time><span>${esc(l.text)}</span></div>`).join('')||'<p class="empty">Пока пусто</p>'}</div></section>
  </div>`;
  $('#drawer').hidden=false;document.body.style.overflow='hidden';

  on('#aBlock',()=>{c.access.status='blocked';log(`Доступ заблокирован: ${c.parent}`);save();toast('Вход в кабинет заблокирован');openClient(id);refresh()});
  on('#aUnblock',()=>{c.access.status=c.access.last?'active':'issued';log(`Доступ разблокирован: ${c.parent}`);save();toast('Вход снова разрешён');openClient(id);refresh()});
  on('#dSave',()=>{
    $$('#drawerIn .kid').forEach(box=>{const k=student(box.dataset.sid),before=JSON.stringify([k.program,k.plan,k.payment,k.group,k.paid]);
      box.querySelectorAll('[data-k]').forEach(el=>{k[el.dataset.k]=el.dataset.k==='paid'?Math.max(0,Math.min(PLANS[k.plan].n,+el.value||0)):el.value});
      if(k.payment==='internal'&&!k.nextPay){k.nextPay=iso(Date.now()+30*DAY);k.payStep=10;if(!k.paid)k.paid=Math.min(PLANS[k.plan].n,k.done+10)}
      if(JSON.stringify([k.program,k.plan,k.payment,k.group,k.paid])!==before)log(`Изменены данные ученика ${k.name}: ${k.program}, ${PLANS[k.plan].t}, ${PAYS[k.payment].t}, ${groupOf(k.group).name}`)});
    save();toast('Сохранено ✓');openClient(id);refresh();
  });
}
function closeDrawer(){$('#drawer').hidden=true;document.body.style.overflow=''}
$('#drawer').onclick=e=>{if(e.target===e.currentTarget)closeDrawer()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#drawer').hidden&&!$('#dlg').open)closeDrawer()});
function refresh(){const h=location.hash.slice(1).split('/')[0]||'dash';renderNav(h);if(h==='clients'){BIND.clients()}else if(h==='payments'||h==='dash'){route()}}

/* ---------- выдача доступа ---------- */
function accessDialog(c,mode){
  const login=mode==='create'?uniqueLogin(translit(c.parent.split(' ')[0])):c.access.login;
  let pass=genPass();
  const name=c.parent.split(' ')[1]||c.parent;
  const text=()=>`Здравствуйте, ${name}! ${mode==='create'?'Доступ в личный кабинет «Уникума»':'Новый пароль от личного кабинета «Уникума»'}:\n${CABINET_URL}\nЛогин: ${$('#acLogin')?$('#acLogin').value.trim():login}\nПароль: ${pass}\nПри первом входе придумайте свой пароль в разделе «Профиль».`;
  $('#dlgBody').innerHTML=`<h2>${mode==='create'?'Создать доступ':'Сбросить пароль'}</h2>
    <p>${esc(c.parent)} · ${esc(c.phone)}</p>
    <div class="fgrid">
      <label class="field"><span>Логин</span><input class="input" id="acLogin" value="${esc(login)}" ${mode==='reset'?'readonly':''} autocapitalize="none" spellcheck="false"></label>
      <div class="field"><span>Временный пароль</span><div class="row" style="flex-wrap:nowrap"><input class="input" id="acPass" value="${esc(pass)}" readonly><button class="btn btn--ghost btn--xs" id="acGen" type="button" title="Другой пароль">↻</button></div></div>
    </div>
    <div class="field"><span>Как отправить</span><div class="seg">${[['sms','SMS на '+c.phone],['telegram','Telegram'],['copy','Скопирую и отправлю сам']].map(([k,t],i)=>`<label><input type="radio" name="acCh" value="${k}" ${i===0?'checked':''}><span>${esc(t)}</span></label>`).join('')}</div></div>
    <div class="msg" id="acMsg"></div>
    <p class="err" id="acErr"></p>
    <div class="dlg__act"><button class="btn btn--ghost" type="button" id="acNo">Отмена</button><button class="btn" type="button" id="acOk">${mode==='create'?'Создать и отправить':'Сбросить и отправить'}</button></div>`;
  const upd=()=>{$('#acMsg').textContent=text()};
  upd();
  $('#acLogin').oninput=()=>{$('#acLogin').value=$('#acLogin').value.toLowerCase().replace(/[^a-z0-9._-]/g,'');$('#acErr').textContent='';upd()};
  $('#acGen').onclick=()=>{pass=genPass();$('#acPass').value=pass;upd()};
  $('#acNo').onclick=()=>$('#dlg').close();
  $('#acOk').onclick=async()=>{
    const l=$('#acLogin').value.trim();
    if(mode==='create'){
      if(l.length<3){$('#acErr').textContent='Логин — от 3 символов латиницей';return}
      if(D.clients.some(x=>x.id!==c.id&&x.access.login===l)){$('#acErr').textContent='Такой логин уже занят';return}
    }
    const ch=document.querySelector('[name=acCh]:checked').value;
    if(ch==='copy'){try{await navigator.clipboard.writeText(text())}catch(e){}}
    c.access={status:'issued',login:l,pass,issued:iso(Date.now()),last:null};
    log(`${mode==='create'?'Выдан доступ':'Сброшен пароль'}: ${c.parent} (логин ${l}) — ${ch==='sms'?'отправлено SMS':ch==='telegram'?'отправлено в Telegram':'сообщение скопировано'}`);
    save();$('#dlg').close();
    toast(ch==='copy'?'Сообщение с логином и паролем скопировано':`Логин и пароль отправлены ${ch==='sms'?'по SMS':'в Telegram'} (демо)`);
    if((location.hash||'').startsWith('#db'))route();else{openClient(c.id);refresh()}
  };
  $('#dlg').showModal();
}

function newClient(){
  $('#dlgBody').innerHTML=`<h2>Новый клиент</h2><p>Обычно клиенты приходят из Битрикс24 автоматически. Здесь — ручное добавление.</p>
    <form id="ncForm" class="fgrid" novalidate>
      <label class="field wide"><span>Родитель (фамилия и имя)</span><input class="input" name="parent" required placeholder="Иванова Анна"></label>
      <label class="field"><span>Телефон</span><input class="input" name="phone" type="tel" required placeholder="+7"></label>
      <label class="field"><span>Сделка Битрикс24</span><input class="input" name="deal" placeholder="номер, необязательно"></label>
      <label class="field"><span>Ребёнок</span><input class="input" name="kid" required></label>
      <label class="field"><span>Дата рождения</span><input class="input" name="birth" type="date" required></label>
      <label class="field"><span>Программа</span><select name="program">${PROGRAMS.map(p=>`<option ${p==='Middle'?'selected':''}>${p}</option>`).join('')}</select></label>
      <label class="field"><span>Вариант обучения</span><select name="plan">${Object.entries(PLANS).map(([v,x])=>`<option value="${v}" ${v==='y2'?'selected':''}>${x.t} · ${x.n}</option>`).join('')}</select></label>
      <label class="field"><span>Способ оплаты</span><select name="payment">${Object.entries(PAYS).map(([v,x])=>`<option value="${v}">${x.t}</option>`).join('')}</select></label>
      <label class="field"><span>Группа</span><select name="group">${D.groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select></label>
      <label class="check wide"><input type="checkbox" name="give" checked> Сразу выдать доступ в кабинет</label>
      <p class="err wide" id="ncErr"></p>
      <div class="dlg__act wide"><button class="btn btn--ghost" type="button" id="ncNo">Отмена</button><button class="btn" type="submit">Добавить</button></div>
    </form>`;
  const f=$('#ncForm');
  $('#ncNo').onclick=()=>$('#dlg').close();
  f.onsubmit=e=>{
    e.preventDefault();
    const v=n=>f.elements[n].value.trim();
    for(const [n,m] of [['parent','Укажите родителя'],['phone','Укажите телефон'],['kid','Укажите имя ребёнка'],['birth','Укажите дату рождения']])
      if(!v(n)){f.elements[n].setAttribute('aria-invalid','true');$('#ncErr').textContent=m;f.elements[n].focus();return}
    if(v('phone').replace(/\D/g,'').length<10){f.elements.phone.setAttribute('aria-invalid','true');$('#ncErr').textContent='Телефон — не меньше 10 цифр';return}
    const c=addClient({parent:v('parent'),phone:v('phone'),deal:v('deal')?'Б24-'+v('deal').replace(/\D/g,''):'',kid:v('kid'),birth:v('birth'),program:v('program'),plan:v('plan'),payment:v('payment'),group:v('group')});
    log(`Добавлен клиент вручную: ${c.parent}`);
    $('#dlg').close();refresh();
    if(f.elements.give.checked){openClient(c.id);accessDialog(c,'create')}else toast('Клиент добавлен');
  };
  $('#dlg').showModal();
}
function addClient(o){
  const fid='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const c={id:fid,parent:o.parent,phone:o.phone,email:'',deal:o.deal,created:iso(Date.now()),access:{status:'none'}};
  D.clients.unshift(c);
  const inst=o.payment==='internal';
  D.students.push({id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),fid,name:o.kid,birth:o.birth,program:o.program,plan:o.plan,payment:o.payment,group:o.group,done:0,
    paid:inst?10:PLANS[o.plan].n,nextPay:inst?iso(Date.now()+30*DAY):null,payStep:inst?10:0});
  save();return c;
}

/* ---------- платёж по рассрочке ---------- */
function payDialog(sid){
  const s=student(sid),tot=PLANS[s.plan].n,left=tot-s.paid;
  $('#dlgBody').innerHTML=`<h2>Платёж получен</h2><p>${esc(s.name)} · ${esc(client(s.fid).parent)}. Сейчас открыто ${s.paid} из ${tot}.</p>
    <div class="fgrid"><label class="field"><span>Открыть ещё занятий</span><input class="input" id="pN" type="number" min="1" max="${left}" value="${Math.min(s.payStep||10,left)}"></label>
    <label class="field"><span>Следующий платёж</span><input class="input" id="pNext" type="date" value="${new Date(Date.now()+30*DAY).toISOString().slice(0,10)}"></label></div>
    <p style="color:var(--muted);font-size:12px">В рабочей версии это будет происходить само: платёжная система сообщит об оплате, и занятия откроются без менеджера.</p>
    <div class="dlg__act"><button class="btn btn--ghost" type="button" id="pNo">Отмена</button><button class="btn btn--ok" type="button" id="pOk">Открыть занятия</button></div>`;
  $('#pNo').onclick=()=>$('#dlg').close();
  $('#pOk').onclick=()=>{
    const n=Math.max(1,Math.min(left,+$('#pN').value||0));
    s.paid+=n;s.nextPay=s.paid>=tot?null:iso(new Date($('#pNext').value+'T12:00:00'));
    if(s.paid>=tot)s.payment='internal';
    log(`Платёж по рассрочке: ${s.name} — открыто ещё ${n} занятий (всего ${s.paid} из ${tot})`);
    save();$('#dlg').close();toast(`Открыто ещё ${n} ${plural(n,'занятие','занятия','занятий')} ✓`);route();
  };
  $('#dlg').showModal();
}

/* =====================================================================
   РАСПИСАНИЕ: уроки групп и пробные уроки
   Преподаватель составляет расписание своих групп и записывает пробные уроки
   (в том числе из заявок с сайта и ботов). Хранится вместе с остальными данными админки.
   ===================================================================== */
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const hm=d=>`${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
const atLocal=(day,time)=>{const [y,m,dd]=day.split('-').map(Number),[h,mi]=time.split(':').map(Number);return new Date(y,m-1,dd,h,mi)};
const weekStart=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TRIAL_RES={planned:['Запланирован','p-lilac'],came:['Пришёл','p-ok'],noshow:['Не пришёл','p-bad'],cancelled:['Отменён','p-mute']};
const SALE_RES={sold:['Купили','p-ok'],thinking:['Думают','p-wait'],refused:['Отказ','p-bad']};
/* МВУ — менеджеры вводных уроков: проводят первый урок и предлагают купить программу */
const MVUS=['Анна (МВУ)','Кирилл (МВУ)'];
const meMvu=()=>role==='mvu'?ROLES.mvu.name:null;
const canBookIntro=()=>role==='admin'||role==='line1';   // записывать на вводный — первая линия
const canSell=()=>role==='admin'||role==='mvu';          // итог урока и продажа — МВУ
const trialOwner=l=>l.mvu||l.teacher||'';
const teachers=()=>[...new Set([ROLES.teacher.name,...(D.staff||[]).filter(x=>x.role==='teacher'&&x.status!=='blocked').map(x=>x.name),...D.groups.map(g=>g.teacher)])];
const meTeacher=()=>role==='teacher'?ROLES.teacher.name:null;

/* старые данные: если расписания ещё нет — строим его на 8 недель вперёд по дню и времени каждой группы */
function ensureSchedule(){
  if(!D.sched)D.sched={lessons:[]};
  if(!D.sched.seeded){
    const start=weekStart(new Date());
    D.groups.filter(g=>!g.solo).forEach(g=>{
      for(let w=-1;w<8;w++){const d=new Date(start);d.setDate(d.getDate()+w*7+((g.wd+6)%7));const at=atLocal(ymd(d),g.time);
        D.sched.lessons.push({id:uid('l'),kind:'group',gid:g.id,date:at.toISOString(),dur:g.program==='Junior'?60:90,topic:'',link:'',status:'planned'})}
    });
    D.sched.seeded=true;save();
  }
}
function visibleLessons(){            // уроки групп: преподаватель — только свои группы
  const mine=new Set(myGroups().map(g=>g.id));
  return D.sched.lessons.filter(l=>l.kind==='group'&&mine.has(l.gid));
}
function visibleIntro(){              // вводные уроки: МВУ — только свои
  const me=meMvu();
  return D.sched.lessons.filter(l=>l.kind==='trial'&&(!me||trialOwner(l)===me));
}
function lessonTitle(l){
  if(l.kind==='trial')return `Вводный урок · ${esc(l.child||'ребёнок')}${l.age?', '+esc(l.age)+' лет':''}`;
  const g=groupOf(l.gid);return `${esc(g?g.name:'Группа')}${l.topic?' · '+esc(l.topic):''}`;
}
function lessonRow(l,withDate){
  const d=new Date(l.date), end=new Date(d.getTime()+(l.dur||60)*60000);
  let pill, extra='';
  if(l.kind==='trial'){const r=TRIAL_RES[l.status]||TRIAL_RES.planned;pill=`<span class="pill ${r[1]}">${r[0]}</span>`;
    if(l.sale&&SALE_RES[l.sale])pill+=`<span class="pill ${SALE_RES[l.sale][1]}">${SALE_RES[l.sale][0]}</span>`;
    extra=`<small>${esc(l.parent||'')}${l.phone?' · '+esc(l.phone):''}${trialOwner(l)&&!meMvu()?' · '+esc(trialOwner(l)):''}${l.rec?' · программа: '+esc(l.rec):''}</small>${l.result?`<small style="color:var(--text)">${esc(l.result)}</small>`:''}`}
  else{const g=groupOf(l.gid);pill=l.status==='cancelled'?'<span class="pill p-mute">отменён</span>':`<span class="pill p-lilac">${g?g.program:''}</span>`;
    extra=`<small>${g?esc(g.teacher):''}${l.link?' · есть ссылка':''}</small>`}
  return `<div class="item sch-item${l.kind==='trial'?' sch-item--trial':''}${l.status==='cancelled'?' sch-item--off':''}">
    <div class="sch-time"><b>${hm(d)}</b><small>${withDate?dt(l.date)+", "+WD[d.getDay()]:hm(end)}</small></div>
    <div class="item__main"><b>${l.kind==='trial'?'🎯 ':''}${lessonTitle(l)}</b>${extra}</div>${pill}
    ${l.link?`<a class="btn btn--ghost btn--xs" href="${esc(l.link)}" target="_blank" rel="noopener">Ссылка</a>`:''}
    ${l.kind==='trial'&&canSell()&&(l.status==='planned'||(l.status==='came'&&!l.sale))&&new Date(l.date)<=new Date(Date.now()+3600e3)?`<button class="btn btn--ok btn--xs" data-trial-res="${l.id}">Итог урока</button>`:''}
    ${l.kind==='trial'&&l.sale==='thinking'&&canSell()?`<a class="btn btn--ghost btn--xs" href="#dozhim">В дожиме</a>`:''}
    ${l.kind==='trial'&&l.sale==='sold'?(l.saleId?'<span class="pill p-ok">✓ продажа оформлена</span>':canSell()?`<button class="btn btn--xs" data-sale="${l.id}">Оформить продажу</button>`:'<span class="pill p-ok">купили</span>'):''}
    <button class="btn btn--ghost btn--xs" data-edit-lesson="${l.id}">Изменить</button></div>`;
}
let schWeek=weekStart(new Date());

function weekView(list,{title,lead,buttons,unit}){
  const ws=new Date(schWeek), we=new Date(ws);we.setDate(we.getDate()+7);
  list=list.filter(l=>{const d=new Date(l.date);return d>=ws&&d<we}).sort((a,b)=>new Date(a.date)-new Date(b.date));
  const days=[...Array(7)].map((_,i)=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d});
  const today=ymd(new Date());
  return `
  <div class="vhead"><div><h1>${title}</h1><p>${lead}</p></div><div class="row">${buttons}</div></div>
  <section class="card">
    <div class="card__h"><div class="row"><button class="btn btn--ghost btn--xs" id="wkPrev" aria-label="Предыдущая неделя">←</button>
      <h2 style="margin:0 6px">${dt(ws)} — ${dt(new Date(we.getTime()-1))}</h2>
      <button class="btn btn--ghost btn--xs" id="wkNext" aria-label="Следующая неделя">→</button>
      ${ymd(ws)!==ymd(weekStart(new Date()))?'<button class="link" id="wkNow">Эта неделя</button>':''}</div>
      <span class="pill p-mute">${list.length} ${plural(list.length,...unit)}</span></div>
    <div class="sch-days">${days.map(d=>{const items=list.filter(l=>ymd(new Date(l.date))===ymd(d));
      return `<div class="sch-day${ymd(d)===today?' sch-day--today':''}"><div class="sch-day__h"><b>${WDF[d.getDay()]}</b><span>${dt(d)}</span></div>
        <div class="list">${items.map(l=>lessonRow(l)).join('')||'<p class="sch-empty">Уроков нет</p>'}</div></div>`}).join('')}</div>
  </section>`;
}
function bindWeek(){
  $('#wkPrev').onclick=()=>{schWeek.setDate(schWeek.getDate()-7);route()};
  $('#wkNext').onclick=()=>{schWeek.setDate(schWeek.getDate()+7);route()};
  const now=$('#wkNow');if(now)now.onclick=()=>{schWeek=weekStart(new Date());route()};
  bindLessonButtons($('#view'));
}
/* расписание групп — для преподавателей (ученики, которые уже купили программу) */
VIEWS.schedule=function(){
  ensureSchedule();
  return weekView(visibleLessons(),{title:'Расписание групп',
    lead:(role==='teacher'?'Уроки ваших групп.':'Уроки всех групп.')+' Составьте расписание группы на несколько недель вперёд, переносите и отменяйте отдельные уроки.',
    buttons:'<button class="btn btn--ghost btn--xs" id="schLesson">＋ Урок</button><button class="btn btn--xs" id="schPlan">＋ Расписание группы</button>',
    unit:['урок','урока','уроков']});
};
BIND.schedule=function(){
  bindWeek();
  $('#schPlan').onclick=()=>openPlanDlg();
  $('#schLesson').onclick=()=>openLessonDlg();
};
/* вводные уроки — для МВУ: первый урок с продажей программы */
VIEWS.intro=function(){
  ensureSchedule();
  const all=visibleIntro(), mon=new Date();mon.setDate(1);mon.setHours(0,0,0,0);
  const monthDone=all.filter(l=>new Date(l.date)>=mon&&l.status==='came'), sold=monthDone.filter(l=>l.sale==='sold').length;
  const need=all.filter(l=>(l.status==='planned'||(l.status==='came'&&!l.sale))&&new Date(l.date)<=new Date()).length;
  return `<div class="kpis" style="grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:20px">
      <a class="kpi" href="${ROLES[role].routes.includes('requests')?'#requests':'#intro'}"><b>${trialNew()}</b><span>новых заявок</span></a>
      <div class="kpi"><b>${all.filter(l=>l.status==='planned'&&new Date(l.date)>new Date()).length}</b><span>впереди вводных уроков</span></div>
      <div class="kpi ${need?'kpi--warn':''}"><b>${need}</b><span>ждут итога</span></div>
      <div class="kpi"><b>${sold}/${monthDone.length}</b><span>продаж в этом месяце</span></div></div>`
    + weekView(all,{title:'Вводные уроки',
    lead:role==='mvu'?'Ваши вводные уроки. Проведите урок, отметьте итог и оформите продажу.':role==='line1'?'Вводные уроки всех МВУ — смотрите свободное время и записывайте детей из заявок.':'Вводные уроки всех МВУ: запись, итоги и продажи.',
    buttons:canBookIntro()?'<a class="btn btn--ghost btn--xs" href="#requests">Заявки</a><button class="btn btn--xs" id="schTrial">＋ Вводный урок</button>':'',
    unit:['вводный урок','вводных урока','вводных уроков']});
};
BIND.intro=function(){
  bindWeek();
  const bt=$('#schTrial');if(bt)bt.onclick=()=>openTrialDlg();
};
function bindLessonButtons(root){
  root.querySelectorAll('[data-edit-lesson]').forEach(b=>b.onclick=()=>{const l=D.sched.lessons.find(x=>x.id===b.dataset.editLesson);l.kind==='trial'?openTrialDlg(l):openLessonDlg(l)});
  root.querySelectorAll('[data-trial-res]').forEach(b=>b.onclick=()=>openTrialResultDlg(D.sched.lessons.find(x=>x.id===b.dataset.trialRes)));
  root.querySelectorAll('[data-sale]').forEach(b=>b.onclick=()=>openSaleDlg(D.sched.lessons.find(x=>x.id===b.dataset.sale)));
}
const groupOptions=sel=>myGroups().filter(g=>!g.solo||true).map(g=>`<option value="${g.id}" ${g.id===sel?'selected':''}>${esc(g.name)}</option>`).join('');
const durOptions=v=>[45,60,90,120].map(m=>`<option value="${m}" ${+v===m?'selected':''}>${m} мин</option>`).join('');
function showDlg(html,onSubmit,onReady){
  $('#dlgBody').innerHTML=html;
  const f=$('#dlgBody form');
  f.querySelectorAll('[data-dlg-close]').forEach(b=>b.onclick=()=>$('#dlg').close());
  f.onsubmit=e=>{e.preventDefault();const err=onSubmit(f);if(err){f.querySelector('.err').textContent=err;return}$('#dlg').close();route()};
  onReady&&onReady(f);
  $('#dlg').showModal();
}

/* составить расписание группы на несколько недель */
function openPlanDlg(gid){
  const g0=groupOf(gid)||myGroups().find(g=>!g.solo)||myGroups()[0];
  if(!g0)return toast('У вас пока нет групп');
  const start=ymd(new Date());
  showDlg(`<h2>Расписание группы</h2><p>Выберите дни недели и время — уроки появятся на нужное число недель вперёд.</p>
    <form class="dlg" style="padding:0;gap:12px" novalidate>
      <label class="field"><span>Группа</span><select name="gid">${groupOptions(g0.id)}</select></label>
      <div class="field"><span>Дни недели</span><div class="seg" id="wdSeg">${[1,2,3,4,5,6,0].map(w=>`<label><input type="checkbox" name="wd" value="${w}" ${w===g0.wd?'checked':''}><span>${WD[w]}</span></label>`).join('')}</div></div>
      <div class="fgrid"><label class="field"><span>Время начала</span><input class="input" type="time" name="time" value="${g0.time||'17:00'}" required></label>
      <label class="field"><span>Длительность</span><select name="dur">${durOptions(g0.program==='Junior'?60:90)}</select></label>
      <label class="field"><span>С какого числа</span><input class="input" type="date" name="from" value="${start}" required></label>
      <label class="field"><span>На сколько недель</span><select name="weeks">${[4,8,12,16,36].map(n=>`<option ${n===8?'selected':''}>${n}</option>`).join('')}</select></label>
      <label class="field wide"><span>Ссылка на урок (Zoom, Телемост…) — необязательно</span><input class="input" name="link" type="url" placeholder="https://"></label></div>
      <label class="check"><input type="checkbox" name="replace" checked> Заменить уже запланированные уроки этой группы с выбранной даты</label>
      <p class="err"></p>
      <div class="dlg__act"><button type="button" class="btn btn--ghost" data-dlg-close>Отмена</button><button class="btn">Составить</button></div></form>`,
  f=>{
    const g=groupOf(f.gid.value), wds=[...f.querySelectorAll('[name=wd]:checked')].map(x=>+x.value);
    if(!wds.length)return 'Выберите хотя бы один день недели';
    if(!f.time.value||!f.from.value)return 'Укажите время и дату начала';
    const from=atLocal(f.from.value,'00:00'), weeks=+f.weeks.value, dur=+f.dur.value;
    if(f.replace.checked)D.sched.lessons=D.sched.lessons.filter(l=>!(l.kind==='group'&&l.gid===g.id&&l.status==='planned'&&new Date(l.date)>=from));
    let n=0;
    for(let i=0;i<weeks*7;i++){const d=new Date(from);d.setDate(d.getDate()+i);if(!wds.includes(d.getDay()))continue;
      D.sched.lessons.push({id:uid('l'),kind:'group',gid:g.id,date:atLocal(ymd(d),f.time.value).toISOString(),dur,topic:'',link:f.link.value.trim(),status:'planned'});n++}
    g.wd=wds[0];g.time=f.time.value;
    if(wds.length>1)g.name=g.name.split(' · ')[0]+' · '+wds.map(w=>WD[w]).join(', ');
    log(`Составлено расписание: ${g.name} — ${n} ${plural(n,'урок','урока','уроков')} с ${dt(from)}`);
    save();toast(`Готово: ${n} ${plural(n,'урок','урока','уроков')} в расписании`);
  });
}

/* один урок группы: добавить / перенести / отменить / удалить */
function openLessonDlg(l,gid){
  const isNew=!l;l=l||{kind:'group',gid:gid||(myGroups()[0]||{}).id,date:new Date(Date.now()+DAY).toISOString(),dur:90,topic:'',link:'',status:'planned'};

    <form class="dlg" style="padding:0;gap:12px" novalidate>

      <label class="field"><span>Статус</span><select name="status"><option value="planned" ${l.status!=='cancelled'?'selected':''}>Запланирован</option><option value="cancelled" ${l.status==='cancelled'?'selected':''}>Отменён</option></select></label>
      <label class="field wide"><span>Тема урока — необязательно</span><input class="input" name="topic" value="${esc(l.topic)}" placeholder="Например: Unity — коллайдеры и физика"></label>
      <label class="field wide"><span>Ссылка на урок — необязательно</span><input class="input" name="link" type="url" value="${esc(l.link)}" placeholder="https://"></label></div>
      <p class="err"></p>
      <div class="dlg__act">${isNew?'':'<button type="button" class="btn btn--danger" id="lDel">Удалить</button>'}<button type="button" class="btn btn--ghost" data-dlg-close>Отмена</button><button class="btn">Сохранить</button></div></form>`,
  f=>{

    if(isNew){l.id=uid('l');D.sched.lessons.push(l)}
    log(`${isNew?'Добавлен':'Изменён'} урок: ${groupOf(l.gid).name}, ${dtt(l.date)}${l.status==='cancelled'?' (отменён)':''}`);
    save();toast('Расписание обновлено ✓');
  },
  f=>{const del=f.querySelector('#lDel');if(del)del.onclick=()=>{D.sched.lessons=D.sched.lessons.filter(x=>x!==l);log(`Удалён урок: ${groupOf(l.gid).name}, ${dtt(l.date)}`);save();$('#dlg').close();toast('Урок удалён');route()}});
}

/* пробный урок: можно заполнить из заявки с сайта или бота */

/* ---------- статистика продаж ---------- */
let salesPeriod='month';
function periodRange(p){
  const now=new Date(), a=new Date(now.getFullYear(),now.getMonth(),1);
  if(p==='month')return [a,new Date(now.getFullYear(),now.getMonth()+1,1)];
  if(p==='prev')return [new Date(now.getFullYear(),now.getMonth()-1,1),a];
  if(p==='week'){const w=weekStart(now);return [w,new Date(w.getTime()+7*DAY)]}
  return [new Date(2000,0,1),new Date(2100,0,1)];
}
function mvuStats(name,[a,b]){
  const inR=d=>{d=new Date(d);return d>=a&&d<b};
  const intro=D.sched.lessons.filter(l=>l.kind==='trial'&&trialOwner(l)===name&&inR(l.date)&&new Date(l.date)<=new Date());
  const came=intro.filter(l=>l.status==='came').length, noshow=intro.filter(l=>l.status==='noshow').length;
  const sales=D.sales.filter(s=>s.mvu===name&&inR(s.date));
  const sum=sales.reduce((x,s)=>x+s.price,0);
  const fromIntro=sales.filter(s=>s.lessonId).length;   // конверсия — только продажи после вводных уроков
  return {name,intro:intro.length,came,noshow,sold:sales.length,fromIntro,conv:came?Math.round(fromIntro/came*100):0,sum,avg:sales.length?Math.round(sum/sales.length):0,sales};
}

  <div class="kpis" style="grid-template-columns:repeat(5,minmax(0,1fr))">

    <div class="kpi"><b>${T.came?Math.round(T.fromIntro/T.came*100):0}%</b><span>конверсия: продажи после вводного</span></div>
    <div class="kpi"><b>${rub(T.sum)}</b><span>выручка${T.sold?' · средний чек '+rub(T.sum/T.sold):''}</span></div></div>
  ${me?'':`<section class="card" style="margin-top:20px"><div class="card__h"><h2>По МВУ</h2></div><div class="tbl-wrap" style="box-shadow:none">
    <table class="sale-tbl"><thead><tr><th>МВУ</th><th>Вводных</th><th>Пришли</th><th>Не пришли</th><th>Продаж</th><th>Конверсия</th><th>Выручка</th><th>Средний чек</th></tr></thead>

  <div class="grid2" style="margin-top:20px">
    <section class="card"><div class="card__h"><h2>Продажи за период</h2></div><div class="list">${list.map(s=>`<div class="item"><div class="item__main">
      <b>${esc(s.parent)} · ${esc(s.kid)}</b><small>${dt(s.date)} · ${s.program}, ${PLAN_LABEL(s.plan)} · ${PAYS[s.payment].t}${s.bank?' ('+esc(s.bank)+', '+s.months+' мес.)':''}${s.payment==='internal'&&s.monthly?' · '+rub(s.monthly)+'/мес':''}${me?'':' · '+esc(s.mvu)}</small>

function ensurePasswords(){
  let ch=false;
  D.clients.forEach(c=>{if(c.access&&c.access.login&&!c.access.pass){c.access.pass=genPass();ch=true}});
  if(ch)save();
}
let dbQ='', dbGroup='', dbShow=false;
const ACC_T={issued:['выдан, не входил','p-new'],active:['входит в кабинет','p-ok'],blocked:['заблокирован','p-mute'],none:['нет доступа','p-mute']};
function dbRows(){
  ensurePasswords();
  const q=dbQ.trim().toLowerCase();
  return D.students.map(s=>{const c=client(s.fid)||{access:{status:'none'}},g=groupOf(s.group)||NO_GROUP;return {s,c,g}})
    .filter(({s,c,g})=>(!dbGroup||(dbGroup==='-'?!s.group:s.group===dbGroup))&&(!q||[s.name,c.parent,c.phone,c.access.login,g.name].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(a.g.name||'я').localeCompare(b.g.name||'я','ru')||a.s.name.localeCompare(b.s.name,'ru'));
}

/* =====================================================================
   ДОЖИМ — родители «думают»: МВУ перезванивает, пишет комментарии и закрывает в продажу или отказ
   ===================================================================== */
function ensureDozhim(){
  if(!D.sched)return;

   СОТРУДНИКИ — учётные записи для входа в админку
   В прототипе логины и пароли хранятся в этом браузере; в рабочей версии их хранит сервер (пароли — только в виде хеша).
   ===================================================================== */

/* сложный пароль: 14 символов, A-z, цифры и спецсимволы, без похожих (0/O, 1/l/I) */
function genStrongPass(len=14){
  const sets=['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnpqrstuvwxyz','23456789','!@#$%&*?-_+='], all=sets.join('');
  const r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  const a=sets.map(x=>x[r(x.length)]);
  while(a.length<len)a.push(all[r(all.length)]);
  for(let i=a.length-1;i>0;i--){const j=r(i+1);[a[i],a[j]]=[a[j],a[i]]}
  return a.join('');
}
/* проверка своего пароля: ≥8 символов, буквы и цифры, без пробелов; оценка надёжности 0–3 */
function passInfo(p){
  const kinds=[/[a-zа-яё]/.test(p),/[A-ZА-ЯЁ]/.test(p),/\d/.test(p),/[^A-Za-zА-Яа-яЁё\d\s]/.test(p)].filter(Boolean).length;
  let err='';
  if(/\s/.test(p))err='Пароль без пробелов';
  else if(p.length<8)err='Пароль — не меньше 8 символов';
  else if(!/[A-Za-zА-Яа-яЁё]/.test(p)||!/\d/.test(p))err='В пароле нужны и буквы, и цифры';
  const score=err?0:(p.length>=12&&kinds>=4)?3:(p.length>=10&&kinds>=3)?2:1;
  return {err,score,label:['слишком простой','средний','хороший','надёжный'][score]};
}

      <p class="st-hint" id="stHint"></p>
      <div class="fgrid"><label class="field"><span>Логин</span><input class="input" name="login" value="${esc(u.login)}" autocapitalize="none" spellcheck="false" placeholder="латиницей"></label>
        </div>${isNew?passField('pass',u.pass):''}
      ${isNew?'<label class="check"><input type="checkbox" name="copy" checked> Скопировать логин и пароль, чтобы отправить сотруднику</label>':''}
      <p class="err"></p>
      <div class="dlg__act"><button type="button" class="btn btn--ghost" data-dlg-close>Отмена</button><button class="btn btn--ok">${isNew?'Создать учётку':'Сохранить'}</button></div></form>`,
  f=>{
    const name=f.name.value.trim(), login=f.login.value.trim().toLowerCase(), r=(f.querySelector('[name=role]:checked')||{}).value;
    if(name.length<2)return 'Укажите имя сотрудника';
    if(login.length<3)return 'Логин — от 3 символов латиницей';
    if(staffLoginTaken(login,u.id)||D.clients.some(c=>c.access&&c.access.login===login))return 'Такой логин уже занят';
    if(isNew){const pi=passInfo(f.pass.value);if(pi.err)return pi.err}
    if(!isNew&&u.name!==name){   // переименование — обновляем имя в группах, вводных и продажах
      D.groups.forEach(g=>{if(g.teacher===u.name)g.teacher=name});
      (D.sched&&D.sched.lessons||[]).forEach(l=>{if(l.mvu===u.name)l.mvu=name;if(l.teacher===u.name)l.teacher=name});
      (D.sales||[]).forEach(x=>{if(x.mvu===u.name)x.mvu=name});
    }
    Object.assign(u,{name,phone:f.phone.value.trim(),login,role:r});
    if(isNew){u.id=uid('u');u.pass=f.pass.value;u.created=iso(Date.now());u.last=null;D.staff.push(u);
      if(f.copy.checked){try{navigator.clipboard.writeText(staffMsg(u,u.pass,true)).catch(()=>{})}catch(e){}}}
    if(ME&&ME.id===u.id){ROLES[role].name=u.name;$('#whoMe b').textContent=u.name}
    ensureStaff();
    log(`${isNew?'Создана учётка сотрудника':'Изменён сотрудник'}: ${u.name} (${STAFF_ROLES[u.role]}, логин ${u.login})`);
    save();toast(isNew?(f.copy.checked?'Учётка создана ✓ Логин и пароль скопированы':'Учётка создана ✓'):'Сохранено ✓');
  },
  f=>{
    const hint={admin:'Видит все разделы, управляет сотрудниками.',line1:'Заявки, запись на вводные уроки, новые лиды — запись в группы.',mvu:'Свои вводные уроки, дожим, продажи и выдача доступа в кабинет.',teacher:'Свои группы, расписание, журнал и проверка заданий.'};
    const sync=()=>{$('#stHint').textContent=hint[(f.querySelector('[name=role]:checked')||{}).value]||''};
    f.querySelectorAll('[name=role]').forEach(x=>x.onchange=sync);sync();
    f.login.oninput=()=>{f.login.dataset.touched=1;f.login.value=f.login.value.toLowerCase().replace(/[^a-z0-9._-]/g,'')};
    if(isNew)f.name.oninput=()=>{if(f.login.dataset.touched)return;const w=f.name.value.trim().split(/\s+/);let l=translit(w[1]||w[0]||'');let k=l,n=2;while(k&&staffLoginTaken(k))k=l+n++;f.login.value=k};
    if(isNew)bindPassField(f,'pass');
  });
}
function openStaffDelDlg(u){
  if(ME&&ME.id===u.id)return toast('Нельзя удалить свою учётную запись');
  const groups=D.groups.filter(g=>g.teacher===u.name);
  const open=(D.sched&&D.sched.lessons||[]).filter(l=>l.kind==='trial'&&l.mvu===u.name&&(l.sale==='thinking'||(l.status==='planned'&&new Date(l.date)>new Date())));
  const lastAdmin=u.role==='admin'&&D.staff.filter(x=>x.role==='admin'&&x.status!=='blocked').length<=1;
  const others=D.staff.filter(x=>x.id!==u.id&&x.role===u.role&&x.status!=='blocked');
  const need=groups.length||open.length;
  showDlg(`<h2>Удалить сотрудника?</h2><p><b>${esc(u.name)}</b> · ${STAFF_ROLES[u.role]} · логин <code>${esc(u.login)}</code></p>
    <form class="dlg" style="padding:0;gap:12px" novalidate>
      <p class="st-warn">Учётная запись удалится навсегда — войти по этому логину будет нельзя. Это нельзя отменить. Если сотрудник может вернуться, лучше заблокируйте его. В истории (продажи, журнал) имя останется.</p>
      ${lastAdmin?'<p class="st-warn">Это последний администратор — удалить его нельзя.</p>':''}
      ${need?`<label class="field"><span>${groups.length?`Ведёт групп: ${groups.length}`:''}${groups.length&&open.length?' · ':''}${open.length?`Открытых вводных и лидов в дожиме: ${open.length}`:''} — передать</span>
        <select name="to">${others.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}<option value="">Никому — оставить без ответственного</option></select></label>`:''}
      <label class="check"><input type="checkbox" name="ok"> Да, удалить ${esc(u.name)}</label>
      <p class="err"></p>
      <div class="dlg__act"><button type="button" class="btn btn--ghost" data-dlg-close>Отмена</button><button class="btn btn--danger" ${lastAdmin?'disabled':''}>Удалить навсегда</button></div></form>`,
  f=>{
    if(lastAdmin)return 'Нельзя удалить последнего администратора';
    if(!f.ok.checked)return 'Поставьте галочку, чтобы подтвердить удаление';
    const to=need&&f.to.value?D.staff.find(x=>x.id===f.to.value):null;
    if(to){groups.forEach(g=>g.teacher=to.name);open.forEach(l=>l.mvu=to.name)}
    D.staff=D.staff.filter(x=>x.id!==u.id);
    ensureStaff();
    log(`Удалён сотрудник: ${u.name} (${STAFF_ROLES[u.role]}, логин ${u.login})${to?' — дела переданы: '+to.name:''}`);
    save();toast(`Сотрудник удалён${to?' · дела переданы: '+to.name:''}`);
  });
}
function openStaffPassDlg(u){
  let pass=genStrongPass();
  showDlg(`<h2>Сбросить пароль</h2><p>${esc(u.name)} · ${STAFF_ROLES[u.role]} · логин <code>${esc(u.login)}</code></p>
    <form class="dlg" style="padding:0;gap:12px" novalidate>
      ${passField('pass',pass)}
      <label class="check"><input type="checkbox" name="copy" checked> Скопировать логин и пароль, чтобы отправить сотруднику</label>
      <p class="err"></p>
      <div class="dlg__act"><button type="button" class="btn btn--ghost" data-dlg-close>Отмена</button><button class="btn btn--ok">Сбросить пароль</button></div></form>`,
  f=>{const p=f.pass.value;const pi=passInfo(p);if(pi.err)return pi.err;
    u.pass=p;if(f.copy.checked){try{navigator.clipboard.writeText(staffMsg(u,p,false)).catch(()=>{})}catch(e){}}
    log(`Сброшен пароль сотрудника: ${u.name}`);save();toast(f.copy.checked?'Пароль сброшен ✓ Данные для входа скопированы':'Пароль сброшен ✓')},
  f=>bindPassField(f,'pass'));
}


/* удалить ученика (только администратор). Если у семьи больше нет детей — можно удалить и семью с доступом в кабинет */
function openStudentDelDlg(sid){
  if(role!=='admin')return;
  const st=student(sid);if(!st)return;
  const c=client(st.fid)||{}, sibs=D.students.filter(x=>x.fid===st.fid&&x.id!==sid), g=groupOf(st.group)||NO_GROUP;
  const hw=(D.homework||[]).filter(h=>h.sid===sid).length, sold=(D.sales||[]).filter(x=>x.sid===sid);
  showDlg(`<h2>Удалить ученика?</h2><p><b>${esc(st.name)}</b> · ${esc(st.program)} · ${st.group?esc(g.name):'без группы'} · родитель ${esc(c.parent||'—')}</p>
    <form class="dlg" style="padding:0;gap:12px" novalidate>
      <p class="st-warn">Ученик удалится из групп, журнала и базы вместе с пропусками, заморозками${hw?` и домашними заданиями (${hw})`:''}. Это нельзя отменить.${sold.length?' Продажа останется в статистике МВУ.':''}</p>
      ${sibs.length?`<p class="st-hint">У семьи останутся дети: ${sibs.map(x=>esc(x.name)).join(', ')} — доступ в кабинет сохранится.</p>`
        :`<label class="check"><input type="checkbox" name="fam" checked> Удалить и семью ${esc(c.parent||'')}${c.access&&c.access.login?` с доступом в кабинет (логин ${esc(c.access.login)})`:''}</label>`}
      <label class="check"><input type="checkbox" name="ok"> Да, удалить ${esc(st.name)}</label>
      <p class="err"></p>
      <div class="dlg__act"><button type="button" class="btn btn--ghost" data-dlg-close>Отмена</button><button class="btn btn--danger">Удалить навсегда</button></div></form>`,
  f=>{
    if(!f.ok.checked)return 'Поставьте галочку, чтобы подтвердить удаление';
    const fam=!sibs.length&&f.fam&&f.fam.checked;
    D.students=D.students.filter(x=>x.id!==sid);
    ['absences','freezes','homework'].forEach(k=>{if(D[k])D[k]=D[k].filter(x=>x.sid!==sid)});
    (D.sales||[]).forEach(x=>{if(x.sid===sid&&!x.placed)x.removed=true});
    if(fam){D.clients=D.clients.filter(x=>x.id!==st.fid);if(D.extras)D.extras=D.extras.filter(x=>x.fid!==st.fid);closeDrawer()}
    log(`Удалён ученик: ${st.name} (${st.program}${st.group?', '+g.name:''})${fam?` и семья ${c.parent}`:''}`);
    save();toast(fam?'Ученик и семья удалены':'Ученик удалён');
    if(!fam&&c.id&&!$('#drawer').hidden)openClient(c.id);
  });
}

$('#q').addEventListener('input',()=>{Q=$('#q').value});
$('#logout').onclick=()=>{try{[sessionStorage,localStorage].forEach(st=>{st.removeItem('unikum-admin-auth');st.removeItem(STAFF_KEY)})}catch(e){}location.replace('cabinet.html')};
$('#resetDemo').onclick=()=>{const keep=D.staff;D=seed();D.staff=keep;ensureStaff();ensureSchedule();ensureSales();ensurePasswords();ensureDozhim();save();toast('Демо-данные сброшены');route()};
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});

<script>
/* ночной режим админки: выбор запоминается в этом браузере */
(function(){
  const root=document.documentElement, meta=document.querySelector('meta[name=theme-color]');
  const apply=t=>{
    if(t==='dark')root.dataset.theme='dark';else delete root.dataset.theme;
    meta&&meta.setAttribute('content',t==='dark'?'#090D22':'#2A0A73');
    document.querySelectorAll('[data-theme-toggle]').forEach(b=>{b.setAttribute('aria-pressed',t==='dark');const l=t==='dark'?'Включить дневной режим':'Включить ночной режим';b.setAttribute('aria-label',l);b.title=l});
  };
  apply(root.dataset.theme==='dark'?'dark':'light');
  document.querySelectorAll('[data-theme-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const t=root.dataset.theme==='dark'?'light':'dark';apply(t);try{localStorage.setItem('unikum-admin-theme',t)}catch(e){}
  }));
})();
</script>
